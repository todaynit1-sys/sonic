<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쏜살: 제주 해안도로 질주</title>
<meta name="description" content="번개 수달 쏜살이 되어 제주 해안도로를 달리는 고속 질주 게임">
<style>
  :root {
    --ink: #f4efe6;
    --ink-soft: #c9c2b4;
    --panel: rgba(18, 22, 26, 0.58);
    --line: rgba(255, 255, 255, 0.14);
    --accent: #f2b33d;
    --teal: #2bb3a3;
    --danger: #ef5b4c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a2430;
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    color: var(--ink);
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none; z-index: 10;
  }
  .hud-panel {
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex; gap: 20px; align-items: center;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .stat-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-value.orbs { color: #8fe6dc; }
  .hearts { font-size: 20px; letter-spacing: 2px; color: var(--danger); line-height: 1.1; }
  .hearts .off { color: rgba(255,255,255,0.18); }

  .boost-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 130px; }
  .boost-bar-bg {
    width: 140px; height: 8px; background: rgba(255,255,255,0.12);
    border-radius: 4px; overflow: hidden;
  }
  .boost-bar-fill { height: 100%; width: 100%; background: var(--accent); }

  #progress-wrap {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: min(360px, 60vw); pointer-events: none; z-index: 10;
  }
  .prog-track { width: 100%; height: 4px; background: rgba(255,255,255,0.22); border-radius: 2px; position: relative; }
  .prog-fill { height: 100%; width: 0%; background: var(--ink); border-radius: 2px; }
  .prog-dot {
    position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fff;
  }
  .prog-end { position: absolute; right: -4px; top: -18px; font-size: 11px; color: var(--ink-soft); }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: linear-gradient(180deg, rgba(10, 16, 24, 0.25) 0%, rgba(10, 16, 24, 0.78) 70%);
    text-align: center; padding: 24px 16px;
  }
  #overlay.hidden { display: none; }
  .kicker { font-size: 14px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  h1 {
    font-size: clamp(44px, 9vw, 88px); font-weight: 900; letter-spacing: -2px; line-height: 1;
    color: #fff; margin-bottom: 12px;
    text-shadow: 0 6px 30px rgba(0,0,0,0.45);
  }
  .subtitle { color: #e7e1d6; font-size: 16px; margin-bottom: 26px; max-width: 480px; line-height: 1.65; }
  .controls-grid {
    display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 8px;
    margin-bottom: 26px; text-align: left; width: min(440px, 100%);
  }
  .ctrl-item {
    background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #e2dccf;
  }
  .ctrl-item b { color: #fff; display: block; margin-bottom: 2px; font-size: 14px; }
  .btn-start {
    cursor: pointer; border: none; outline: none;
    padding: 15px 44px; border-radius: 10px; font-size: 18px; font-weight: 800; color: #1d1608;
    background: var(--accent); font-family: inherit;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .result-stats {
    display: flex; gap: 24px; margin: 4px 0 26px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,0.07); border: 1px solid var(--line); padding: 14px 24px; border-radius: 10px;
  }

  #touch-controls {
    position: fixed; bottom: 16px; left: 16px; right: 16px;
    display: none; justify-content: space-between; align-items: flex-end;
    z-index: 15; pointer-events: none;
  }
  .touch-group { display: flex; gap: 10px; pointer-events: auto; }
  .t-btn {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(18, 22, 26, 0.55); color: #fff; font-size: 20px; font-weight: 800;
    border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; font-family: inherit;
    touch-action: none;
  }
  .t-btn.boost { background: rgba(242, 179, 61, 0.75); color: #1d1608; font-size: 13px; }
  @media (pointer: coarse), (max-width: 820px) {
    #touch-controls { display: flex; }
    #progress-wrap { display: none; }
    .hud-panel { padding: 8px 12px; gap: 14px; }
    .stat-value { font-size: 18px; }
    .boost-wrap { min-width: 90px; }
    .boost-bar-bg { width: 90px; }
  }
  @media (max-width: 520px) {
    #hud { flex-direction: column; }
    .controls-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-panel">
    <div class="stat"><span class="stat-label">점수</span><span class="stat-value" id="ui-score">0</span></div>
    <div class="stat"><span class="stat-label">윤슬 구슬</span><span class="stat-value orbs" id="ui-orbs">0</span></div>
    <div class="stat"><span class="stat-label">시간</span><span class="stat-value" id="ui-time">00:00</span></div>
    <div class="stat"><span class="stat-label">체력</span><span class="hearts" id="ui-hearts"></span></div>
  </div>
  <div class="hud-panel">
    <div class="boost-wrap">
      <span class="stat-label">순풍 부스트 (Shift)</span>
      <div class="boost-bar-bg"><div class="boost-bar-fill" id="ui-boost"></div></div>
    </div>
    <div class="stat"><span class="stat-label">속도</span><span class="stat-value" id="ui-speed">0</span></div>
  </div>
</div>

<div id="progress-wrap">
  <div class="prog-track">
    <div class="prog-fill" id="ui-prog-fill"></div>
    <div class="prog-dot" id="ui-prog-dot"></div>
    <span class="prog-end">등대</span>
  </div>
</div>

<div id="overlay">
  <div class="kicker" id="ov-kicker">제주 해안도로 질주</div>
  <h1 id="ov-title">쏜살</h1>
  <p class="subtitle" id="ov-desc">번개 수달 쏜살이 바닷바람을 타고 해안도로를 내달립니다. 윤슬 구슬을 모으고, 고장 난 경비 로봇을 뚫고, 끝에 있는 등대까지 달려가세요.</p>
  <div class="controls-grid" id="ov-controls">
    <div class="ctrl-item"><b>달리기</b>← / → 또는 A / D</div>
    <div class="ctrl-item"><b>점프 · 공중 대시</b>Space, ↑ 또는 W (공중에서 한 번 더)</div>
    <div class="ctrl-item"><b>구르기 출발</b>↓ 누른 채 Space 여러 번 → ↓ 떼기</div>
    <div class="ctrl-item"><b>순풍 부스트</b>Shift (돌진하며 로봇 격파)</div>
  </div>
  <div class="result-stats" id="ov-results" style="display:none;"></div>
  <button class="btn-start" id="btn-start">출발</button>
</div>

<div id="touch-controls">
  <div class="touch-group">
    <button class="t-btn" data-key="left" aria-label="왼쪽">◀</button>
    <button class="t-btn" data-key="down" aria-label="웅크리기">▼</button>
    <button class="t-btn" data-key="right" aria-label="오른쪽">▶</button>
  </div>
  <div class="touch-group">
    <button class="t-btn boost" data-key="boost">부스트</button>
    <button class="t-btn" data-key="jump" aria-label="점프">▲</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const $ = id => document.getElementById(id);
  const uiScore = $('ui-score'), uiOrbs = $('ui-orbs'), uiTime = $('ui-time'), uiHearts = $('ui-hearts');
  const uiBoost = $('ui-boost'), uiSpeed = $('ui-speed'), uiProgFill = $('ui-prog-fill'), uiProgDot = $('ui-prog-dot');
  const overlay = $('overlay'), ovTitle = $('ov-title'), ovKicker = $('ov-kicker'), ovDesc = $('ov-desc');
  const ovControls = $('ov-controls'), ovResults = $('ov-results'), btnStart = $('btn-start');

  let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
  }
  addEventListener('resize', resize);
  resize();

  // 결정적 해시 (프레임마다 같은 장식이 같은 자리에)
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // ================= 사운드 =================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null, noiseBuf = null, windGain = null, windFilter = null, master = null;
  function initAudio() {
    if (!AudioCtx) return;
    if (!audioCtx) {
      audioCtx = new AudioCtx();
      master = audioCtx.createGain(); master.gain.value = 0.9; master.connect(audioCtx.destination);
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < d.length; i++) { b = b * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = b * 6; }
      const src = audioCtx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
      windGain = audioCtx.createGain(); windGain.gain.value = 0;
      src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
      src.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, endFreq, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(master);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function noise(dur, freq, vol, type = 'lowpass') {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(now, Math.random()); src.stop(now + dur + 0.02);
  }
  const sfx = {
    orb: () => { tone(880, 1320, 0.09, 'sine', 0.08); tone(1320, 1760, 0.14, 'sine', 0.06, 0.05); },
    jump: () => { noise(0.08, 900, 0.25); tone(220, 420, 0.12, 'sine', 0.06); },
    land: v => noise(0.12, 500, clamp(v / 1400, 0.08, 0.5)),
    step: () => noise(0.05, 700, 0.12),
    skid: () => noise(0.25, 2400, 0.18, 'bandpass'),
    charge: n => tone(160 + n * 3, 320 + n * 4, 0.09, 'triangle', 0.06),
    release: () => { noise(0.3, 1200, 0.35); tone(140, 600, 0.25, 'triangle', 0.08); },
    boost: () => { noise(0.4, 1800, 0.35, 'bandpass'); tone(200, 700, 0.3, 'sine', 0.05); },
    ramp: () => { noise(0.1, 300, 0.4); tone(180, 90, 0.15, 'triangle', 0.08); },
    smash: () => { noise(0.25, 3000, 0.4, 'highpass'); tone(260, 60, 0.25, 'square', 0.07); },
    hurt: () => { noise(0.2, 600, 0.45); tone(420, 160, 0.3, 'triangle', 0.1); },
    clear: () => [392, 494, 587, 784].forEach((f, i) => tone(f, f, 0.5, 'triangle', 0.09, i * 0.14))
  };

  // ================= 지형 =================
  const STAGE_LENGTH = 13500;
  function getGroundY(x) {
    const base = 520;
    if (x < 450) return base;
    const k = Math.min(1, (x - 450) / 400);
    const h = Math.sin(x * 0.0016) * 78 + Math.sin(x * 0.0043 + 1.2) * 34 + (Math.cos(x * 0.00085) - 1) * 55 + Math.sin(x * 0.011) * 6;
    const endBlend = x > STAGE_LENGTH - 700 ? Math.max(0, 1 - (x - (STAGE_LENGTH - 700)) / 500) : 1;
    return base + h * k * endBlend;
  }
  const RAMP_LEN = 80, RAMP_H = 30;
  let ramps = [];
  function rampLift(x) {
    for (const r of ramps) if (x >= r.x && x <= r.x + RAMP_LEN) return ((x - r.x) / RAMP_LEN) * RAMP_H;
    return 0;
  }
  const surfaceY = x => getGroundY(x) - rampLift(x);
  const slopeAt = x => (getGroundY(x + 4) - getGroundY(x - 4)) / 8;

  // ================= 미리 그려 두는 그림 =================
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // 현무암 질감
  const basalt = makeCanvas(160, 160);
  (() => {
    const g = basalt.getContext('2d');
    g.fillStyle = '#3a3836'; g.fillRect(0, 0, 160, 160);
    for (let i = 0; i < 1400; i++) {
      const v = 40 + Math.random() * 40 | 0;
      g.fillStyle = `rgba(${v},${v - 2},${v - 4},${0.35 + Math.random() * 0.4})`;
      g.fillRect(Math.random() * 160, Math.random() * 160, 1 + Math.random() * 3, 1 + Math.random() * 3);
    }
    for (let i = 0; i < 70; i++) { // 기공
      const x = Math.random() * 160, y = Math.random() * 160, r = 1 + Math.random() * 3.5;
      g.fillStyle = 'rgba(12,11,10,0.75)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      g.fillStyle = 'rgba(120,115,108,0.25)'; g.beginPath(); g.arc(x - r * 0.3, y - r * 0.4, r * 0.6, 0, 7); g.fill();
    }
    g.strokeStyle = 'rgba(15,14,13,0.5)'; g.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) { // 균열
      g.beginPath(); let x = Math.random() * 160, y = Math.random() * 160; g.moveTo(x, y);
      for (let j = 0; j < 4; j++) { x += (Math.random() - 0.5) * 40; y += Math.random() * 30; g.lineTo(x, y); }
      g.stroke();
    }
  })();
  const basaltPattern = ctx.createPattern(basalt, 'repeat');

  // 부드러운 구름
  const cloudSprites = [];
  for (let s = 0; s < 6; s++) {
    const c = makeCanvas(420, 170), g = c.getContext('2d');
    const puffs = 14 + Math.random() * 10 | 0;
    for (let i = 0; i < puffs; i++) {
      const t = i / puffs;
      const x = 60 + t * 300 + (Math.random() - 0.5) * 40;
      const y = 105 - Math.sin(t * Math.PI) * 35 + (Math.random() - 0.5) * 22;
      const r = 26 + Math.sin(t * Math.PI) * 34 + Math.random() * 14;
      const rg = g.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
      rg.addColorStop(0, 'rgba(255,255,255,0.95)');
      rg.addColorStop(0.6, 'rgba(250,247,242,0.55)');
      rg.addColorStop(1, 'rgba(240,240,245,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    // 아랫면 그늘
    g.globalCompositeOperation = 'source-atop';
    const sh = g.createLinearGradient(0, 60, 0, 160);
    sh.addColorStop(0, 'rgba(160,175,200,0)'); sh.addColorStop(1, 'rgba(130,145,175,0.55)');
    g.fillStyle = sh; g.fillRect(0, 0, 420, 170);
    cloudSprites.push(c);
  }
  const clouds = [];
  for (let i = 0; i < 9; i++) clouds.push({ x: i * 330 + Math.random() * 160, y: 30 + Math.random() * 130, s: 0.55 + Math.random() * 0.75, sp: 4 + Math.random() * 7, i: i % 6 });

  // 윤슬 구슬
  const orbSprite = makeCanvas(48, 48);
  (() => {
    const g = orbSprite.getContext('2d');
    const glow = g.createRadialGradient(24, 24, 4, 24, 24, 24);
    glow.addColorStop(0, 'rgba(160,255,240,0.55)'); glow.addColorStop(1, 'rgba(120,230,220,0)');
    g.fillStyle = glow; g.fillRect(0, 0, 48, 48);
    const body = g.createRadialGradient(20, 19, 1, 24, 24, 11);
    body.addColorStop(0, '#f2fffd'); body.addColorStop(0.35, '#7fe3d6'); body.addColorStop(0.85, '#1b8f8a'); body.addColorStop(1, '#0f5a5e');
    g.fillStyle = body; g.beginPath(); g.arc(24, 24, 10.5, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(20, 19.5, 3.4, 2.2, -0.6, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1; g.beginPath(); g.arc(24, 24, 8, 0.3, 1.6); g.stroke();
  })();

  // ================= 게임 상태 =================
  const keys = { left: false, right: false, down: false, jump: false, boost: false };
  let jumpPressed = false;
  let state = 'menu';
  let elapsed = 0, score = 0, orbsGot = 0, combo = 0, shake = 0, timeTick = 0;
  let cx = 0, cy = 0, zoom = 1;
  let vL = 0, vR = 0, vT = 0, vB = 0;
  let player = {};
  let orbList = [], scattered = [], enemies = [], pads = [], particles = [], afterimages = [], floatTexts = [], walls = [], gulls = [];
  let maxHearts = 3;

  function resetGame() {
    elapsed = 0; score = 0; orbsGot = 0; combo = 0; shake = 0;
    player = {
      x: 160, y: getGroundY(160) - 24, vx: 0, vy: 0, radius: 24, facing: 1,
      grounded: true, spinning: false, crouching: false, spinCharge: 0,
      boostEnergy: 100, boosting: false, invuln: 0, hearts: maxHearts,
      animPhase: 0, airDash: true, angle: 0, squash: 0, lastStepSign: 1, skidCD: 0
    };
    cx = player.x + W * 0.15; cy = player.y - 60;
    orbList = []; scattered = []; enemies = []; pads = []; particles = []; afterimages = []; floatTexts = []; ramps = []; walls = [];

    // 돌담
    for (let x = 300; x < STAGE_LENGTH; x += 260) {
      if (hash(x) > 0.45) walls.push({ x, len: 120 + hash(x + 1) * 220 });
    }
    // 구슬
    for (let x = 520; x < STAGE_LENGTH - 500; x += 520) {
      const pattern = Math.floor((x / 520) % 3);
      if (pattern === 0) for (let i = 0; i < 6; i++) { const rx = x + i * 44; orbList.push({ x: rx, y: getGroundY(rx) - 36 }); }
      else if (pattern === 1) for (let i = 0; i < 7; i++) { const rx = x + i * 42; orbList.push({ x: rx, y: getGroundY(rx) - 40 - Math.sin((i / 6) * Math.PI) * 110 }); }
      else for (let i = 0; i < 5; i++) { const rx = x + i * 48; orbList.push({ x: rx, y: getGroundY(rx) - 130 }); }
    }
    // 점프대 (오르막 끝에서 속도만큼 날아오름)
    for (let x = 1350; x < STAGE_LENGTH - 900; x += 1650) {
      ramps.push({ x });
      for (let i = 0; i < 6; i++) orbList.push({ x: x + 180 + i * 60, y: getGroundY(x) - 180 - Math.sin(i / 5 * Math.PI) * 70 });
    }
    // 가속 발판
    for (let x = 900; x < STAGE_LENGTH - 1000; x += 1450) pads.push({ x, cd: 0 });
    // 고장 난 경비 로봇
    for (let x = 1100; x < STAGE_LENGTH - 750; x += 680) {
      const flying = ((x / 680) | 0) % 2 === 1;
      enemies.push({ type: flying ? 'drone' : 'crab', x, startX: x, y: 0, vx: flying ? 85 : 60, range: 180, alive: true, phase: Math.random() * 6 });
    }
    // 갈매기
    gulls = [];
    for (let i = 0; i < 5; i++) gulls.push({ x: Math.random() * 1600, y: 70 + Math.random() * 120, sp: 18 + Math.random() * 16, ph: Math.random() * 6, s: 0.7 + Math.random() * 0.6 });
    renderHearts();
  }

  function renderHearts() {
    let s = '';
    for (let i = 0; i < maxHearts; i++) s += i < player.hearts ? '♥' : '<span class="off">♥</span>';
    uiHearts.innerHTML = s;
  }

  // ================= 입력 =================
  addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!keys.jump) jumpPressed = true;
      keys.jump = true;
    }
    if (e.code === 'Enter' && state !== 'playing') btnStart.click();
  });
  addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
  });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.t-btn').forEach(btn => {
    const k = btn.dataset.key;
    const onDown = e => { e.preventDefault(); initAudio(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; };
    const onUp = e => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('touchstart', onDown, { passive: false });
    btn.addEventListener('touchend', onUp, { passive: false });
    btn.addEventListener('touchcancel', onUp, { passive: false });
    btn.addEventListener('mousedown', onDown);
    btn.addEventListener('mouseup', onUp);
    btn.addEventListener('mouseleave', onUp);
  });
  btnStart.addEventListener('click', () => {
    initAudio(); resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    btnStart.blur();
  });

  // ================= 이펙트 =================
  function burst(x, y, n, color, speed = 200, size = 3, grav = 500, life = 0.6) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.8) * speed;
      particles.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: life * (0.5 + Math.random() * 0.6), max: life, color, size: size * (0.6 + Math.random() * 0.8), grav });
    }
  }
  function dust(x, y, n, dir = 0, spd = 80) {
    for (let i = 0; i < n; i++) {
      particles.push({
        kind: 'dust', x: x + (Math.random() - 0.5) * 14, y: y - Math.random() * 4,
        vx: dir * (40 + Math.random() * spd) + (Math.random() - 0.5) * 50, vy: -20 - Math.random() * 50,
        life: 0.5 + Math.random() * 0.5, max: 1, size: 4 + Math.random() * 5, grow: 18 + Math.random() * 14, grav: -10
      });
    }
  }
  function floatText(x, y, text, color = '#fff') { floatTexts.push({ x, y, text, color, life: 1 }); }

  // ================= 업데이트 =================
  function update(dt) {
    timeTick += dt;
    clouds.forEach(c => { c.x -= c.sp * dt; });
    gulls.forEach(g => { g.x += g.sp * dt; });

    if (state !== 'playing') { updateCamera(dt); updateWind(); return; }
    elapsed += dt;
    shake = Math.max(0, shake - dt * 30);
    player.invuln = Math.max(0, player.invuln - dt);
    player.squash = Math.max(0, player.squash - dt * 5);
    player.skidCD = Math.max(0, player.skidCD - dt);

    const p = player;
    const slope = slopeAt(p.x);
    const maxRun = 760;
    const speed = Math.abs(p.vx);

    // 부스트
    if (keys.boost && p.boostEnergy > 4 && !p.crouching) {
      if (!p.boosting) { sfx.boost(); shake = 4; }
      p.boosting = true;
      p.boostEnergy = Math.max(0, p.boostEnergy - dt * 30);
      p.vx += (p.facing * 1120 - p.vx) * Math.min(1, dt * 6);
      if (p.grounded && Math.random() < 0.6) dust(p.x - p.facing * 16, p.y + p.radius, 1, -p.facing, 160);
    } else {
      p.boosting = false;
      p.boostEnergy = Math.min(100, p.boostEnergy + dt * 6);
    }

    // 웅크리기 · 구르기 출발
    if (p.grounded && keys.down && speed < 120) {
      p.crouching = true;
      p.vx *= Math.pow(0.02, dt);
      if (jumpPressed) {
        p.spinCharge = Math.min(100, p.spinCharge + 25);
        sfx.charge(p.spinCharge);
        dust(p.x - p.facing * 14, p.y + p.radius, 4, -p.facing, 120);
      }
    } else {
      if (p.crouching && p.spinCharge > 0) {
        p.vx = p.facing * (600 + p.spinCharge * 5);
        p.spinning = true;
        sfx.release(); shake = 5;
        dust(p.x - p.facing * 10, p.y + p.radius, 12, -p.facing, 220);
      }
      p.crouching = false; p.spinCharge = 0;
    }

    // 좌우 이동 (관성 · 미끄러짐)
    if (!p.crouching && !p.boosting) {
      const dir = keys.right ? 1 : keys.left ? -1 : 0;
      if (dir) {
        p.facing = dir;
        const opposing = Math.sign(p.vx) === -dir && speed > 40;
        if (opposing && p.grounded) {
          p.vx += dir * 2400 * dt; // 브레이크
          if (speed > 260) {
            if (Math.random() < 0.7) dust(p.x + Math.sign(p.vx) * 10, p.y + p.radius, 1, Math.sign(p.vx), 60);
            if (p.skidCD <= 0) { sfx.skid(); p.skidCD = 0.4; }
          }
        } else if (dir * p.vx < maxRun) {
          const a = p.grounded ? 900 - clamp(speed, 0, 700) * 0.6 : 520; // 빠를수록 가속이 줄어듦
          p.vx += dir * a * dt;
          if (dir * p.vx > maxRun && p.grounded) p.vx = dir * maxRun;
        }
      } else if (p.grounded) {
        const fr = p.spinning ? 0.6 : 0.18; // 구를 땐 덜 멈춤
        p.vx *= Math.pow(fr, dt);
        if (Math.abs(p.vx) < 6) p.vx = 0;
      }
    }

    // 경사: 내리막은 빨라지고 오르막은 느려짐
    if (p.grounded) {
      p.vx += slope * (p.spinning ? 1500 : 900) * dt;
      if (Math.abs(p.vx) < 140) p.spinning = false;
    } else {
      p.vx *= Math.pow(0.92, dt); // 공기 저항
    }

    // 점프 · 공중 대시
    if (jumpPressed && !p.crouching) {
      if (p.grounded) {
        // 경사면에 수직으로 튀어 오름
        const ang = Math.atan(slope);
        p.vy = -640 * Math.cos(ang) + p.vx * Math.sin(ang) * 0.3;
        p.vx += 640 * Math.sin(ang) * 0.25;
        p.grounded = false; p.spinning = true; p.airDash = true;
        sfx.jump();
        dust(p.x, p.y + p.radius, 6, 0, 60);
      } else if (p.airDash) {
        p.airDash = false; p.spinning = true;
        p.vx = p.facing * Math.max(Math.abs(p.vx), 640);
        p.vy = Math.min(p.vy, -220);
        sfx.boost();
        burst(p.x - p.facing * 10, p.y, 8, 'rgba(255,255,255,0.8)', 140, 2.5, 0, 0.35);
      }
    }
    jumpPressed = false;

    // 중력 · 이동
    const prevX = p.x;
    if (!p.grounded) p.vy = Math.min(p.vy + (keys.jump && p.vy < 0 ? 1450 : 2100) * dt, 1400); // 길게 누르면 높이
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < 40) { p.x = 40; p.vx = 0; }

    // 점프대 끝에서 날아오르기
    for (const r of ramps) {
      const end = r.x + RAMP_LEN;
      if (p.grounded && prevX < end && p.x >= end && p.vx > 120) {
        p.grounded = false;
        p.vy = -Math.min(760, 240 + p.vx * 0.42);
        p.spinning = false; p.airDash = true;
        sfx.ramp(); shake = 3;
      }
    }

    // 지면
    const gY = surfaceY(p.x);
    if (p.y + p.radius >= gY) {
      if (!p.grounded && p.vy > 0) {
        if (p.vy > 500) { p.squash = clamp(p.vy / 1400, 0.2, 0.7); dust(p.x, gY, Math.min(14, p.vy / 80 | 0), 0, 100); }
        sfx.land(p.vy);
        // 착지할 때 낙하 속도 일부가 경사 방향 속도로 바뀜
        p.vx += slopeAt(p.x) * p.vy * 0.5;
        p.grounded = true; p.spinning = keys.down && Math.abs(p.vx) > 200; combo = 0;
      }
      if (p.grounded) { p.y = gY - p.radius; p.vy = 0; }
    } else if (p.grounded) {
      // 언덕 꼭대기에서 너무 빠르면 살짝 뜸
      const gap = gY - (p.y + p.radius);
      const curveFly = speed > 700 && gap > 6;
      if (gap > 18 || curveFly) { p.grounded = false; p.vy = 0; }
      else p.y = gY - p.radius;
    }

    // 몸 기울기 (경사 따라)
    const targetAng = p.grounded ? Math.atan(slopeAt(p.x)) : clamp(p.vy / 2400, -0.25, 0.3) * p.facing;
    p.angle = lerp(p.angle, targetAng, Math.min(1, dt * 12));

    // 달리기 동작 · 발소리
    p.animPhase += (p.grounded ? Math.max(4, speed * 0.04) : 3) * dt;
    if (p.grounded && !p.spinning && speed > 40) {
      const s = Math.sign(Math.sin(p.animPhase));
      if (s !== p.lastStepSign) { p.lastStepSign = s; sfx.step(); if (speed > 380 && Math.random() < 0.6) dust(p.x - p.facing * 6, p.y + p.radius, 1, -p.facing, 40); }
    }
    if (speed > 620 || p.boosting) {
      if (Math.random() < 0.5) afterimages.push({ x: p.x, y: p.y, spinning: p.spinning, facing: p.facing, angle: p.angle, life: 0.18 });
    }

    // 구슬
    for (let i = orbList.length - 1; i >= 0; i--) {
      const o = orbList[i];
      const dx = p.x - o.x, dy = p.y - o.y;
      if (dx * dx + dy * dy < 36 * 36) {
        orbList.splice(i, 1);
        orbsGot++; score += 100;
        p.boostEnergy = Math.min(100, p.boostEnergy + 4);
        sfx.orb();
        burst(o.x, o.y, 6, '#bff7ef', 120, 2, 100, 0.45);
      }
    }
    for (let i = scattered.length - 1; i >= 0; i--) {
      const s = scattered[i];
      s.life -= dt; s.vy += 1200 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const sg = getGroundY(s.x);
      if (s.y + 10 > sg) { s.y = sg - 10; s.vy = -Math.abs(s.vy) * 0.55; s.vx *= 0.8; }
      if (s.life < 3.6) {
        const dx = p.x - s.x, dy = p.y - s.y;
        if (dx * dx + dy * dy < 34 * 34) { orbsGot++; score += 50; sfx.orb(); scattered.splice(i, 1); continue; }
      }
      if (s.life <= 0) scattered.splice(i, 1);
    }

    // 가속 발판
    for (const pd of pads) {
      pd.cd = Math.max(0, pd.cd - dt);
      const dx = p.x - pd.x, dy = (p.y + p.radius) - getGroundY(pd.x);
      if (Math.abs(dx) < 40 && Math.abs(dy) < 22 && pd.cd <= 0) {
        p.vx = Math.max(p.vx, 1250); p.facing = 1; pd.cd = 0.5;
        p.boostEnergy = Math.min(100, p.boostEnergy + 20);
        sfx.boost(); shake = 4;
        dust(p.x, p.y + p.radius, 8, -1, 200);
      }
    }

    // 로봇
    for (const en of enemies) {
      if (!en.alive) continue;
      en.phase += dt * 4;
      en.x += en.vx * dt;
      if (en.x > en.startX + en.range) { en.x = en.startX + en.range; en.vx = -Math.abs(en.vx); }
      if (en.x < en.startX - en.range) { en.x = en.startX - en.range; en.vx = Math.abs(en.vx); }
      en.y = en.type === 'drone' ? getGroundY(en.x) - 125 + Math.sin(en.phase) * 14 : getGroundY(en.x) - 16;
      if (en.type === 'drone' && Math.random() < dt * 1.5) burst(en.x - 10, en.y + 6, 3, '#ffd36b', 90, 1.6, 600, 0.4);

      const dx = p.x - en.x, dy = p.y - en.y;
      if (dx * dx + dy * dy < 42 * 42) {
        const stomp = !p.grounded && p.vy > 0 && dy < -8;
        if (p.spinning || p.boosting || stomp) {
          en.alive = false; combo++;
          const pts = 200 * combo; score += pts;
          p.boostEnergy = Math.min(100, p.boostEnergy + 15);
          if (!p.grounded && !p.boosting) { p.vy = -500; p.airDash = true; }
          sfx.smash(); shake = 7;
          burst(en.x, en.y, 18, '#ffb347', 300, 3.2, 700, 0.7);
          burst(en.x, en.y, 10, '#6b6f75', 220, 4, 900, 0.9);
          floatText(en.x, en.y - 26, `+${pts}${combo > 1 ? `  ${combo}연속` : ''}`, '#ffe3a1');
        } else if (p.invuln <= 0) {
          p.hearts--; renderHearts();
          const drop = Math.min(orbsGot, 10);
          for (let i = 0; i < drop; i++) {
            const a = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7, s = 200 + Math.random() * 300;
            scattered.push({ x: p.x, y: p.y - 10, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 4.5 });
          }
          orbsGot -= drop;
          p.invuln = 1.8; p.vy = -420; p.grounded = false; p.spinning = false;
          p.vx = (dx >= 0 ? 1 : -1) * 280;
          sfx.hurt(); shake = 12;
          if (p.hearts <= 0) endGame(false);
        }
      }
    }

    // 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.grav * dt;
      if (q.kind === 'dust') { q.size += q.grow * dt; q.vx *= Math.pow(0.2, dt); }
      if (q.life <= 0) particles.splice(i, 1);
    }
    for (let i = afterimages.length - 1; i >= 0; i--) if ((afterimages[i].life -= dt) <= 0) afterimages.splice(i, 1);
    for (let i = floatTexts.length - 1; i >= 0; i--) { const f = floatTexts[i]; f.life -= dt; f.y -= 45 * dt; if (f.life <= 0) floatTexts.splice(i, 1); }

    if (p.x >= STAGE_LENGTH && state === 'playing') endGame(true);

    updateCamera(dt);
    updateWind();

    // HUD
    uiScore.textContent = score.toLocaleString();
    uiOrbs.textContent = orbsGot;
    uiTime.textContent = fmtTime(elapsed);
    uiBoost.style.width = `${p.boostEnergy}%`;
    uiSpeed.textContent = `${Math.round(Math.abs(p.vx) * 0.09)} km/h`;
    const prog = Math.min(100, (p.x / STAGE_LENGTH) * 100);
    uiProgFill.style.width = `${prog}%`;
    uiProgDot.style.left = `${prog}%`;
  }

  const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

  function updateCamera(dt) {
    const p = player, speed = Math.abs(p.vx);
    const base = clamp(Math.min(H / 720, W / 900), 0.62, 1.25);
    const targetZoom = base * (1 - clamp((speed - 300) / 900, 0, 0.16));
    zoom = lerp(zoom, targetZoom, Math.min(1, dt * 1.5));
    const look = p.facing * Math.min(240, speed * 0.28);
    const tx = p.x + look + (W * 0.12) / zoom;
    const ty = p.y - 120 / zoom;
    cx = lerp(cx, tx, Math.min(1, dt * 5));
    cy = lerp(cy, ty, Math.min(1, dt * (p.grounded ? 5 : 2.5)));
    cx = Math.max(cx, W / (2 * zoom) - 40);
  }
  function updateWind() {
    if (!windGain) return;
    const s = state === 'playing' ? Math.abs(player.vx) : 0;
    const t = audioCtx.currentTime;
    windGain.gain.setTargetAtTime(0.015 + clamp(s / 1200, 0, 1) * 0.16, t, 0.15);
    windFilter.frequency.setTargetAtTime(300 + s * 1.4, t, 0.2);
  }

  function endGame(cleared) {
    state = cleared ? 'clear' : 'gameover';
    let extra = '';
    if (cleared) {
      sfx.clear();
      const timeBonus = Math.max(0, Math.round((120 - elapsed) * 50));
      const orbBonus = orbsGot * 100, heartBonus = player.hearts * 1000;
      score += timeBonus + orbBonus + heartBonus;
      ovKicker.textContent = '등대 도착';
      ovTitle.textContent = '완주!';
      ovDesc.textContent = '해안도로 끝 등대까지 달렸습니다. 더 빠른 길을 찾아 기록을 줄여 보세요.';
      extra = `<div class="stat"><span class="stat-label">남은 체력</span><span class="stat-value">${player.hearts}</span></div>`;
    } else {
      ovKicker.textContent = '체력이 다 떨어졌어요';
      ovTitle.textContent = '다시 한 번';
      ovDesc.textContent = '로봇은 구르거나, 부스트로 돌진하거나, 위에서 밟으면 부술 수 있어요.';
    }
    ovControls.style.display = 'none';
    ovResults.style.display = 'flex';
    ovResults.innerHTML = `
      <div class="stat"><span class="stat-label">최종 점수</span><span class="stat-value">${score.toLocaleString()}</span></div>
      <div class="stat"><span class="stat-label">윤슬 구슬</span><span class="stat-value orbs">${orbsGot}</span></div>
      <div class="stat"><span class="stat-label">기록</span><span class="stat-value">${fmtTime(elapsed)}</span></div>${extra}`;
    btnStart.textContent = '다시 달리기';
    overlay.classList.remove('hidden');
    keys.boost = false;
  }

  // ================= 그리기: 배경 =================
  let horizon = 0, sunX = 0, sunY = 0;
  function drawBackground() {
    horizon = Math.round(H * 0.6 - (cy - 450) * 0.06 * zoom);
    sunX = W * 0.8 - cx * 0.008;
    sunY = H * 0.16;

    // 하늘
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#3f6f9e');
    sky.addColorStop(0.55, '#86b1d0');
    sky.addColorStop(0.9, '#d9e2df');
    sky.addColorStop(1, '#f1e4cc');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon + 2);

    // 해와 빛무리
    const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.55);
    sg.addColorStop(0, 'rgba(255,250,235,1)');
    sg.addColorStop(0.025, 'rgba(255,246,222,0.95)');
    sg.addColorStop(0.08, 'rgba(255,232,190,0.35)');
    sg.addColorStop(0.4, 'rgba(255,220,170,0.08)');
    sg.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, horizon + 2);

    // 구름
    const span = W + 900;
    for (const c of clouds) {
      const x = (((c.x - cx * 0.04) % span) + span) % span - 450;
      const s = c.s * clamp(W / 1200, 0.6, 1.2);
      ctx.globalAlpha = 0.9;
      ctx.drawImage(cloudSprites[c.i], x, c.y * (H / 800), 420 * s, 170 * s);
    }
    ctx.globalAlpha = 1;

    // 한라산 (아주 멀리)
    const mx = W * 0.62 - cx * 0.03;
    const mtn = ctx.createLinearGradient(0, horizon - 240, 0, horizon);
    mtn.addColorStop(0, '#a9b9c7'); mtn.addColorStop(0.25, '#93a9bd'); mtn.addColorStop(1, '#bfccd3');
    ctx.fillStyle = mtn;
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for (let sx = 0; sx <= W + 8; sx += 8) {
      const d = sx - mx;
      const h = 175 * Math.exp(-Math.pow(d / (W * 0.42), 2)) + 22 * Math.exp(-Math.pow(d / 70, 2)) + Math.sin(sx * 0.05) * 1.5;
      ctx.lineTo(sx, horizon - 8 - h * clamp(H / 800, 0.6, 1.1));
    }
    ctx.lineTo(W, horizon); ctx.fill();

    // 오름 (작은 화산 언덕)
    ctx.fillStyle = '#8fa3a3';
    drawHumps(0.08, 520, 46, 0.18);
    ctx.fillStyle = '#7d958f';
    drawHumps(0.13, 410, 34, 0.55);

    // 풍력발전기
    const tSpan = 460, off = cx * 0.2;
    for (let i = Math.floor(off / tSpan) - 1; i < Math.floor((off + W) / tSpan) + 2; i++) {
      if (hash(i * 3.1) < 0.35) continue;
      const x = i * tSpan - off + hash(i) * 120;
      const hgt = 70 + hash(i + 7) * 30;
      drawTurbine(x, horizon - 4, hgt);
    }

    // 바다
    const sea = ctx.createLinearGradient(0, horizon, 0, H);
    sea.addColorStop(0, '#6f9fb8');
    sea.addColorStop(0.15, '#3f7d9c');
    sea.addColorStop(1, '#173e57');
    ctx.fillStyle = sea; ctx.fillRect(0, horizon, W, H - horizon);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, horizon, W, 1);

    // 물결 (멀수록 촘촘하고 느리게)
    for (let i = 1; i < 26; i++) {
      const t = i / 26, y = horizon + Math.pow(t, 1.7) * (H - horizon);
      const len = 6 + t * 40, gap = 30 + t * 120;
      const shift = (timeTick * (8 + t * 30) + cx * (0.25 + t * 0.6)) % gap;
      ctx.fillStyle = `rgba(220,238,245,${0.06 + t * 0.12})`;
      for (let x = -shift + hash(i) * gap - gap; x < W; x += gap) ctx.fillRect(x, y, len, 1 + t * 1.5);
    }
    // 햇빛 반짝임
    ctx.fillStyle = 'rgba(255,246,220,0.7)';
    for (let i = 0; i < 40; i++) {
      const t = i / 40, y = horizon + 2 + Math.pow(t, 1.5) * (H - horizon) * 0.7;
      const spread = 20 + t * 160;
      const flick = Math.sin(timeTick * 5 + i * 2.3);
      if (flick < 0.1) continue;
      const w = (6 + t * 30) * flick;
      ctx.fillRect(sunX + Math.sin(i * 12.7 + timeTick) * spread - w / 2, y, w, 1 + t * 2);
    }

    // 갈매기
    ctx.strokeStyle = 'rgba(40,48,58,0.75)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (const g of gulls) {
      const span2 = W + 200;
      const x = (((g.x - cx * 0.3) % span2) + span2) % span2 - 100;
      const y = g.y * (H / 800) + Math.sin(timeTick * 0.7 + g.ph) * 8;
      const f = Math.sin(timeTick * 7 + g.ph) * 4 * g.s, w = 8 * g.s;
      ctx.beginPath(); ctx.moveTo(x - w, y - f); ctx.quadraticCurveTo(x - w / 2, y - 3 * g.s, x, y); ctx.quadraticCurveTo(x + w / 2, y - 3 * g.s, x + w, y - f); ctx.stroke();
    }
  }
  function drawHumps(par, tile, hgt, seed) {
    const off = cx * par;
    ctx.beginPath(); ctx.moveTo(0, horizon + 1);
    for (let sx = 0; sx <= W + 6; sx += 6) {
      const wx = sx + off;
      const i = Math.floor(wx / tile), f = (wx / tile) - i;
      const hh = hgt * (0.5 + hash(i + seed * 100) * 0.8);
      const shape = Math.pow(Math.sin(f * Math.PI), 0.8) * (hash(i * 2 + seed) > 0.3 ? 1 : 0.25);
      ctx.lineTo(sx, horizon - 2 - shape * hh * clamp(H / 800, 0.6, 1.1));
    }
    ctx.lineTo(W, horizon + 1); ctx.fill();
  }
  function drawTurbine(x, base, h) {
    ctx.strokeStyle = 'rgba(236,240,242,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - h); ctx.stroke();
    const rot = timeTick * 1.4 + x * 0.01;
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 3; k++) {
      const a = rot + k * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x + Math.cos(a) * h * 0.42, base - h + Math.sin(a) * h * 0.42); ctx.stroke();
    }
    ctx.fillStyle = '#eef1f2'; ctx.fillRect(x - 3, base - h - 2, 6, 4);
  }

  // ================= 그리기: 지형 =================
  function drawWalls() {
    for (const w of walls) {
      if (w.x + w.len < vL || w.x > vR) continue;
      for (let x = w.x; x < w.x + w.len; x += 13) {
        const gy = getGroundY(x);
        const r1 = hash(x), r2 = hash(x + 0.5);
        for (let row = 0; row < 3; row++) {
          const sx = x + (row % 2) * 6, sy = gy - 8 - row * 11;
          const rw = 8 + r1 * 4, rh = 6 + r2 * 2;
          ctx.fillStyle = row === 2 ? '#3b3a38' : '#2d2c2a';
          ctx.beginPath(); ctx.ellipse(sx, sy, rw, rh, (r1 - 0.5) * 0.6, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(160,150,135,0.22)';
          ctx.beginPath(); ctx.ellipse(sx - 2, sy - 2, rw * 0.5, rh * 0.4, 0, 0, 7); ctx.fill();
        }
      }
    }
  }

  function drawTerrain() {
    const step = 8;
    const x0 = Math.floor(vL / step) * step - step, x1 = vR + step;

    // 현무암 절벽
    ctx.beginPath();
    ctx.moveTo(x0, vB + 50);
    for (let x = x0; x <= x1; x += step) ctx.lineTo(x, getGroundY(x));
    ctx.lineTo(x1, vB + 50); ctx.closePath();
    ctx.fillStyle = basaltPattern; ctx.fill();
    // 깊이 그늘
    ctx.save(); ctx.clip();
    const depth = ctx.createLinearGradient(0, 380, 0, 900);
    depth.addColorStop(0, 'rgba(70,52,34,0.35)');
    depth.addColorStop(0.3, 'rgba(0,0,0,0.1)');
    depth.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = depth; ctx.fillRect(x0, vT, x1 - x0, vB - vT + 60);
    ctx.restore();

    // 흙층
    ctx.strokeStyle = '#5a4128'; ctx.lineWidth = 16; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { const y = getGroundY(x) + 9; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();

    // 풀밭 (해를 향한 면은 밝게)
    ctx.lineWidth = 9; ctx.lineCap = 'butt';
    for (let x = x0; x < x1; x += step) {
      const s = slopeAt(x);
      const light = clamp(0.5 - s * 1.4, 0.15, 0.9);
      ctx.strokeStyle = `rgb(${lerp(58, 122, light) | 0},${lerp(92, 150, light) | 0},${lerp(38, 58, light) | 0})`;
      ctx.beginPath(); ctx.moveTo(x, getGroundY(x) + 3); ctx.lineTo(x + step + 0.5, getGroundY(x + step) + 3); ctx.stroke();
    }
    ctx.lineCap = 'round';

    // 풀잎
    const wind = Math.sin(timeTick * 1.3) * 2;
    ctx.lineWidth = 1.6;
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass ? '#9cba5c' : '#4f7a34';
      ctx.beginPath();
      for (let x = Math.floor(vL / 5) * 5; x < vR; x += 5) {
        const r = hash(x + pass * 0.37);
        const gy = getGroundY(x) - 1;
        const h = 5 + r * (pass ? 7 : 11);
        const sway = wind + Math.sin(timeTick * 3 + x * 0.05) * 1.5 + (player.grounded && Math.abs(player.x - x) < 30 ? Math.sign(x - player.x) * 4 : 0);
        ctx.moveTo(x, gy); ctx.quadraticCurveTo(x + sway * 0.4, gy - h * 0.6, x + sway, gy - h);
      }
      ctx.stroke();
    }

    // 유채꽃 / 억새 군락
    for (let gx = Math.floor(vL / 300) * 300; gx < vR; gx += 300) {
      const r = hash(gx * 0.01);
      if (r < 0.4) continue;
      const canola = r > 0.65;
      const width = 90 + hash(gx + 3) * 120;
      for (let x = gx; x < gx + width; x += canola ? 4 : 9) {
        const gy = getGroundY(x), rr = hash(x * 1.7);
        const h = canola ? 10 + rr * 14 : 18 + rr * 22;
        const sw = Math.sin(timeTick * 2 + x * 0.04) * (canola ? 1.5 : 4);
        if (canola) {
          ctx.strokeStyle = '#5f8a3a'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + sw, gy - h); ctx.stroke();
          ctx.fillStyle = rr > 0.5 ? '#f3d23a' : '#e6c12a';
          ctx.fillRect(x + sw - 2, gy - h - 2, 4, 4);
        } else {
          ctx.strokeStyle = '#a99b78'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x, gy); ctx.quadraticCurveTo(x + sw * 0.3, gy - h * 0.5, x + sw, gy - h); ctx.stroke();
          ctx.fillStyle = 'rgba(232,224,205,0.85)';
          ctx.beginPath(); ctx.ellipse(x + sw, gy - h - 3, 2, 5, sw * 0.08, 0, 7); ctx.fill();
        }
      }
    }
  }

  // ================= 그리기: 사물 =================
  function groundShadow(x, height, w) {
    const gy = surfaceY(x);
    const k = clamp(1 - height / 260, 0.15, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.32 * k})`;
    ctx.beginPath(); ctx.ellipse(x, gy + 1, w * (0.6 + 0.4 * k), 4 * k + 1, 0, 0, 7); ctx.fill();
  }

  function drawRamp(r) {
    const gy0 = getGroundY(r.x), gy1 = getGroundY(r.x + RAMP_LEN);
    ctx.fillStyle = '#6b4a2e';
    ctx.beginPath();
    ctx.moveTo(r.x, gy0); ctx.lineTo(r.x + RAMP_LEN, gy1 - RAMP_H); ctx.lineTo(r.x + RAMP_LEN, gy1 + 2); ctx.lineTo(r.x, gy0 + 2); ctx.closePath(); ctx.fill();
    // 판자
    ctx.strokeStyle = '#a5794d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(r.x, gy0 - 1); ctx.lineTo(r.x + RAMP_LEN, gy1 - RAMP_H - 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(40,25,12,0.6)'; ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const t = i / 5, x = r.x + t * RAMP_LEN, y = lerp(gy0, gy1 - RAMP_H, t);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, lerp(gy0, gy1, t) + 2); ctx.stroke();
    }
    // 노란 경고 띠
    ctx.fillStyle = '#e9b52f'; ctx.fillRect(r.x + RAMP_LEN - 4, gy1 - RAMP_H, 4, RAMP_H);
  }

  function drawPad(pd) {
    const gy = getGroundY(pd.x);
    ctx.save(); ctx.translate(pd.x, gy); ctx.rotate(Math.atan(slopeAt(pd.x)));
    const plate = ctx.createLinearGradient(0, -6, 0, 3);
    plate.addColorStop(0, '#9aa1a6'); plate.addColorStop(1, '#4b5156');
    ctx.fillStyle = plate; ctx.beginPath(); ctx.roundRect(-36, -5, 72, 8, 2); ctx.fill();
    const on = 0.55 + Math.max(0, Math.sin(timeTick * 10)) * 0.45;
    ctx.fillStyle = `rgba(245,190,60,${on})`;
    for (let i = -24; i <= 16; i += 14) { ctx.beginPath(); ctx.moveTo(i, -4); ctx.lineTo(i + 9, -1); ctx.lineTo(i, 2); ctx.lineTo(i + 3, -1); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

  function drawLighthouse() {
    const x = STAGE_LENGTH + 120, gy = getGroundY(STAGE_LENGTH);
    if (x + 120 < vL || x - 300 > vR) return;
    // 결승선
    ctx.fillStyle = '#e8e2d4'; ctx.fillRect(STAGE_LENGTH - 2, gy - 70, 4, 70);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#1f1f1f' : '#f4f4f4'; ctx.fillRect(STAGE_LENGTH + 2, gy - 70 + i * 6, 26, 6); }
    // 등대
    const h = 210, bw = 46, tw = 32;
    const body = ctx.createLinearGradient(x - bw / 2, 0, x + bw / 2, 0);
    body.addColorStop(0, '#d8d3c8'); body.addColorStop(0.45, '#ffffff'); body.addColorStop(1, '#b9b3a8');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(x - bw / 2, gy); ctx.lineTo(x - tw / 2, gy - h); ctx.lineTo(x + tw / 2, gy - h); ctx.lineTo(x + bw / 2, gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c4382c';
    for (const t of [0.25, 0.6]) {
      const y0 = gy - h * t, y1 = y0 - 26;
      const w0 = lerp(bw, tw, t) / 2, w1 = lerp(bw, tw, (h * t + 26) / h) / 2;
      ctx.beginPath(); ctx.moveTo(x - w0, y0); ctx.lineTo(x - w1, y1); ctx.lineTo(x + w1, y1); ctx.lineTo(x + w0, y0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#2b2f33'; ctx.fillRect(x - 24, gy - h - 6, 48, 6);
    ctx.fillStyle = '#ffe7a3'; ctx.fillRect(x - 13, gy - h - 30, 26, 24);
    ctx.fillStyle = '#c4382c'; ctx.beginPath(); ctx.moveTo(x - 17, gy - h - 30); ctx.lineTo(x, gy - h - 48); ctx.lineTo(x + 17, gy - h - 30); ctx.fill();
    // 회전하는 불빛
    const a = Math.sin(timeTick * 1.6);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(x, 0, x + a * 420, 0);
    beam.addColorStop(0, 'rgba(255,240,190,0.45)'); beam.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = beam;
    ctx.beginPath(); ctx.moveTo(x, gy - h - 18); ctx.lineTo(x + a * 420, gy - h - 60); ctx.lineTo(x + a * 420, gy - h + 24); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawDrone(en) {
    groundShadow(en.x, getGroundY(en.x) - en.y, 18);
    ctx.save(); ctx.translate(en.x, en.y);
    ctx.rotate(Math.sin(en.phase * 0.7) * 0.12 + (en.vx > 0 ? 0.08 : -0.08));
    // 팔
    ctx.strokeStyle = '#2f3438'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(20, -6); ctx.stroke();
    // 프로펠러 (흐림)
    for (const sx of [-20, 20]) {
      ctx.fillStyle = '#25292c'; ctx.fillRect(sx - 2, -11, 4, 6);
      ctx.fillStyle = 'rgba(200,210,215,0.35)';
      ctx.beginPath(); ctx.ellipse(sx, -12, 14, 2.2, 0, 0, 7); ctx.fill();
    }
    const b = ctx.createLinearGradient(0, -8, 0, 8);
    b.addColorStop(0, '#8c949a'); b.addColorStop(0.5, '#59616a'); b.addColorStop(1, '#2d3237');
    ctx.fillStyle = b; ctx.beginPath(); ctx.roundRect(-14, -8, 28, 15, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-10, -6, 18, 2);
    // 카메라 눈
    const dir = en.vx > 0 ? 1 : -1;
    ctx.fillStyle = '#16191b'; ctx.beginPath(); ctx.arc(dir * 7, 2, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = Math.sin(timeTick * 8) > 0 ? '#ff4a3a' : '#7a1d16'; ctx.beginPath(); ctx.arc(dir * 7, 2, 2, 0, 7); ctx.fill();
    // 끊어진 전선
    ctx.strokeStyle = '#c9822e'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-6, 7); ctx.quadraticCurveTo(-9, 14 + Math.sin(en.phase * 2) * 3, -4, 18); ctx.stroke();
    ctx.restore();
  }

  function drawCrab(en) {
    groundShadow(en.x, 0, 24);
    ctx.save(); ctx.translate(en.x, en.y);
    const t = en.phase * 2.2;
    // 다리
    ctx.strokeStyle = '#4a2c18'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      for (const side of [-1, 1]) {
        const ph = Math.sin(t + i * 1.4 + (side > 0 ? Math.PI : 0)) * 4;
        const hx = side * (6 + i * 4), fx = side * (16 + i * 5) + ph;
        ctx.beginPath(); ctx.moveTo(hx, 2); ctx.lineTo(side * (14 + i * 4), -4 - Math.abs(ph) * 0.5); ctx.lineTo(fx, 16); ctx.stroke();
      }
    }
    // 집게
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#9a4e22';
      ctx.beginPath(); ctx.ellipse(side * 24, -6 + Math.sin(t * 0.5 + side) * 2, 7, 5, side * 0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(side * 28, -8); ctx.lineTo(side * 31, -5); ctx.stroke();
    }
    // 등껍질 (녹슨 금속)
    const sh = ctx.createRadialGradient(-6, -12, 2, 0, -2, 22);
    sh.addColorStop(0, '#d48a4c'); sh.addColorStop(0.55, '#97501f'); sh.addColorStop(1, '#4d260c');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(0, -2, 19, 12, 0, Math.PI, 0); ctx.lineTo(19, 3); ctx.quadraticCurveTo(0, 8, -19, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(40,70,60,0.45)'; // 녹
    ctx.beginPath(); ctx.ellipse(7, -5, 5, 2.5, 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#e6c08a';
    for (const rx of [-12, -4, 4, 12]) { ctx.beginPath(); ctx.arc(rx, -1, 1.2, 0, 7); ctx.fill(); }
    // 눈 자루
    for (const side of [-1, 1]) {
      ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(side * 5, -12); ctx.lineTo(side * 6, -20); ctx.stroke();
      ctx.fillStyle = '#ffd25e'; ctx.beginPath(); ctx.arc(side * 6, -21, 2.6, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ================= 그리기: 쏜살 (번개 수달) =================
  function drawOtter(x, y, facing, spinning, alpha, angle, ghost) {
    const p = player;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.translate(0, 24); ctx.scale(facing * 1.3, 1.3); ctx.translate(0, -24);
    const speed = Math.abs(p.vx);
    const t = timeTick;

    if (spinning) {
      const r = 19;
      ctx.translate(0, 4);
      if (!ghost) {
        // 흐름 자국
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, r + 4 + i * 3, Math.PI * 0.6 + i * 0.1, Math.PI * 1.35); ctx.stroke(); }
      }
      ctx.rotate(t * (10 + speed * 0.03));
      const fur = ctx.createRadialGradient(-6, -6, 2, 0, 0, r);
      fur.addColorStop(0, '#b47a47'); fur.addColorStop(0.7, '#6e4222'); fur.addColorStop(1, '#40240f');
      ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3a210e'; ctx.lineWidth = 6; // 감싼 꼬리
      ctx.beginPath(); ctx.arc(0, 0, r - 5, 0.4, 2.6); ctx.stroke();
      ctx.fillStyle = '#e9d5b3'; ctx.beginPath(); ctx.arc(4, -3, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#26a596'; ctx.fillRect(-r + 2, -2, 10, 4);
      ctx.restore();
      return;
    }

    const crouch = p.crouching && !ghost;
    const run = clamp(speed / 760, 0, 1);
    const lean = (p.grounded ? run * 0.22 : 0.05);
    const sq = p.squash;
    ctx.translate(0, 24);
    ctx.scale(1 + sq * 0.25, 1 - sq * 0.3 - (crouch ? 0.25 : 0));
    ctx.translate(0, -24);
    ctx.rotate(lean);

    const ph = p.animPhase;
    const stride = p.grounded ? Math.sin(ph) : 0.6;
    const lift = p.grounded ? Math.max(0, Math.cos(ph)) : 0;
    const bob = p.grounded ? Math.abs(Math.sin(ph)) * run * -3 : 0;
    ctx.translate(0, bob);

    // 목도리 꼬리 (속도만큼 휘날림)
    const scarfLen = 10 + run * 26 + (p.boosting ? 12 : 0);
    ctx.strokeStyle = '#1e8f83'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [w, off] of [[5, 0], [3.5, 3]]) {
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(-1, -6 + off);
      for (let i = 1; i <= 6; i++) {
        const k = i / 6;
        ctx.lineTo(-k * scarfLen - 2, -6 + off + Math.sin(t * 16 - i * 1.1) * (2 + k * 4 * (0.4 + run)) + k * (4 - run * 6));
      }
      ctx.stroke();
    }

    // 꼬리
    const tailWave = Math.sin(t * 6 + ph * 0.5) * (3 + run * 3);
    const tg = ctx.createLinearGradient(-40, 0, -6, 0);
    tg.addColorStop(0, '#3e230e'); tg.addColorStop(1, '#6b4021');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(-6, 4);
    ctx.quadraticCurveTo(-24, 6 + tailWave * 0.5, -42, 12 + tailWave - run * 8);
    ctx.quadraticCurveTo(-26, 15 + tailWave * 0.4, -6, 14);
    ctx.closePath(); ctx.fill();

    // 뒷다리
    const leg = (s, shade) => {
      const fx = s * 11, fy = 22 - (s > 0 ? lift : Math.max(0, -Math.cos(ph))) * 6 * run;
      ctx.strokeStyle = shade; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-1, 10); ctx.quadraticCurveTo(fx * 0.5 - 2, 17, fx, fy); ctx.stroke();
      ctx.fillStyle = '#2c1909';
      ctx.beginPath(); ctx.ellipse(fx + 3, fy + 1.5, 6, 3, 0, 0, 7); ctx.fill();
    };
    leg(-stride, '#4c2c13');

    // 몸통
    const bodyG = ctx.createRadialGradient(-2, -6, 2, 0, 2, 18);
    bodyG.addColorStop(0, '#a46c3c'); bodyG.addColorStop(0.65, '#74462a'); bodyG.addColorStop(1, '#4a2b14');
    ctx.fillStyle = bodyG;
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 14, -0.15, 0, 7); ctx.fill();
    ctx.fillStyle = '#e4cfab';
    ctx.beginPath(); ctx.ellipse(5, 4, 5.5, 9.5, -0.15, 0, 7); ctx.fill();

    // 앞다리
    leg(stride, '#5e371a');

    // 팔 (달릴 때 반대로 흔듦)
    const arm = p.grounded ? -stride * 7 * (0.3 + run) : -4;
    ctx.strokeStyle = '#5e371a'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(4, -2); ctx.quadraticCurveTo(8 + arm * 0.4, 3, 10 + arm, 7); ctx.stroke();

    // 목도리 매듭
    ctx.fillStyle = '#26a596';
    ctx.beginPath(); ctx.ellipse(2, -6, 9, 3.6, -0.1, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-6, -5, 16, 1.5);

    // 머리
    const headG = ctx.createRadialGradient(3, -20, 2, 6, -14, 13);
    headG.addColorStop(0, '#ae7646'); headG.addColorStop(0.7, '#7a4a2b'); headG.addColorStop(1, '#52301a');
    ctx.fillStyle = headG;
    ctx.beginPath(); ctx.ellipse(6, -15, 11, 10, 0.1, 0, 7); ctx.fill();
    // 귀
    ctx.fillStyle = '#4a2b14'; ctx.beginPath(); ctx.arc(-2, -22, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#c99a72'; ctx.beginPath(); ctx.arc(-2, -22, 1.6, 0, 7); ctx.fill();
    // 주둥이
    ctx.fillStyle = '#e8d3b0';
    ctx.beginPath(); ctx.ellipse(14, -11, 7, 5, 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b120c'; ctx.beginPath(); ctx.ellipse(19.5, -13, 2.6, 2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(19, -13.8, 0.7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#5a3a24'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(15, -8); ctx.quadraticCurveTo(17, -6.5, 19, -8); ctx.stroke();
    // 눈
    ctx.fillStyle = '#140b06'; ctx.beginPath(); ctx.ellipse(11, -17, 2.2, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11.8, -17.8, 0.8, 0, 7); ctx.fill();
    // 수염
    ctx.strokeStyle = 'rgba(245,235,220,0.75)'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(16, -10); ctx.lineTo(27, -12 - run * 2);
    ctx.moveTo(16, -9); ctx.lineTo(27, -8 - run * 2);
    ctx.stroke();
    // 고글
    ctx.strokeStyle = '#2a2420'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(5, -18, 11, 4, 0.1, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    const lens = ctx.createLinearGradient(2, -26, 8, -20);
    lens.addColorStop(0, '#ffe08a'); lens.addColorStop(1, '#c47a14');
    ctx.fillStyle = '#2a2420'; ctx.beginPath(); ctx.ellipse(5, -23.5, 5.4, 3.6, 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = lens; ctx.beginPath(); ctx.ellipse(5, -23.5, 4, 2.5, 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(3, -25, 2, 1);

    // 부스트 바람 갈래
    if (p.boosting && !ghost) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const yy = -20 + i * 11, ln = 18 + ((t * 300 + i * 37) % 30);
        ctx.beginPath(); ctx.moveTo(26, yy); ctx.quadraticCurveTo(10, yy - 3, -ln, yy + 2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ================= 화면 =================
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();

    vL = cx - W / (2 * zoom) - 40; vR = cx + W / (2 * zoom) + 40;
    vT = cy - H / (2 * zoom) - 40; vB = cy + H / (2 * zoom) + 40;

    ctx.save();
    const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(W / 2 + sx, H / 2 + sy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);

    drawWalls();
    drawTerrain();
    for (const r of ramps) if (r.x + RAMP_LEN > vL && r.x < vR) drawRamp(r);
    for (const pd of pads) if (pd.x > vL && pd.x < vR) drawPad(pd);
    drawLighthouse();

    // 구슬
    for (const o of orbList) {
      if (o.x < vL || o.x > vR) continue;
      const bobY = Math.sin(timeTick * 3 + o.x * 0.05) * 3;
      ctx.drawImage(orbSprite, o.x - 24, o.y - 24 + bobY);
    }
    for (const s of scattered) {
      if (s.life < 1.5 && Math.sin(timeTick * 30) < 0) continue;
      ctx.drawImage(orbSprite, s.x - 24, s.y - 24);
    }

    for (const en of enemies) {
      if (!en.alive || en.x < vL - 40 || en.x > vR + 40) continue;
      en.type === 'drone' ? drawDrone(en) : drawCrab(en);
    }

    // 먼지 (캐릭터 뒤)
    for (const q of particles) {
      if (q.kind !== 'dust') continue;
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1) * 0.45;
      ctx.fillStyle = '#c9b894';
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 그림자 + 쏜살
    const p = player;
    groundShadow(p.x, surfaceY(p.x) - (p.y + p.radius), 24);
    for (const a of afterimages) drawOtter(a.x, a.y, a.facing, a.spinning, a.life * 1.6, a.angle, true);
    if (p.invuln <= 0 || Math.floor(timeTick * 16) % 2 === 0) drawOtter(p.x, p.y, p.facing, p.spinning, 1, p.angle, false);

    // 불꽃 파편
    for (const q of particles) {
      if (q.kind !== 'spark') continue;
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;

    ctx.font = '800 17px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
    for (const f of floatTexts) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(f.text, f.x + 1, f.y + 1);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 고속 바람 줄기
    const sp = state === 'playing' ? Math.abs(p.vx) : 0;
    if (sp > 650) {
      const k = clamp((sp - 650) / 600, 0, 1);
      ctx.strokeStyle = `rgba(255,255,255,${0.12 + k * 0.18})`; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 14; i++) {
        const y = hash(i + Math.floor(timeTick * 20) * 0.13) * H;
        const x = hash(i * 7 + Math.floor(timeTick * 20)) * W;
        const len = 60 + k * 160;
        if (Math.abs(y - H * 0.55) < H * 0.12) continue;
        ctx.moveTo(x, y); ctx.lineTo(x - len * p.facing, y);
      }
      ctx.stroke();
    }

    // 색감 마무리: 따뜻한 햇빛 + 가장자리 어둡게
    const warm = ctx.createLinearGradient(W, 0, 0, H);
    warm.addColorStop(0, 'rgba(255,214,150,0.12)');
    warm.addColorStop(0.5, 'rgba(255,214,150,0)');
    warm.addColorStop(1, 'rgba(30,50,80,0.12)');
    ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(8,12,18,0.42)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  }

  // ================= 루프 =================
  resetGame();
  updateCamera(1);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__sonsal = { get player() { return player; }, get state() { return state; }, keys, step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); render(); } };
})();
</script>
</body>
