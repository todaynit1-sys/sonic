<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수퍼 소닉: 시네마틱 러시</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #061224;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 18px; left: 22px; right: 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .hud-panel {
    background: rgba(6, 18, 38, 0.62);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(80, 190, 255, 0.35);
    border-radius: 14px;
    padding: 12px 18px;
    color: #fff;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    display: flex; gap: 22px; align-items: center;
  }
  .stat { display: flex; flex-direction: column; }
  .stat-label {
    font-size: 11px; letter-spacing: 1.2px; color: #7fd4ff; font-weight: 700;
  }
  .stat-value {
    font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(0, 180, 255, 0.65);
  }
  .stat-value.rings { color: #ffd84d; text-shadow: 0 0 12px rgba(255, 200, 0, 0.7); }
  .stat-value.danger { color: #ff4d5e; animation: pulse 0.6s infinite; }

  .boost-wrap { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
  .boost-bar-bg {
    width: 160px; height: 12px; background: rgba(255,255,255,0.14);
    border-radius: 999px; overflow: hidden; border: 1px solid rgba(100,210,255,0.4);
  }
  .boost-bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #0077ff, #00e5ff, #ffffff);
    box-shadow: 0 0 14px #00d9ff;
    transition: width 0.08s linear;
  }

  #progress-wrap {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    width: 240px; pointer-events: none; z-index: 10;
    background: rgba(6, 18, 38, 0.55); padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(6px);
  }
  .prog-track {
    width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 999px; position: relative;
  }
  .prog-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #1b8cff, #5ef2ff); border-radius: 999px;
  }
  .prog-dot {
    position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
    width: 12px; height: 12px; border-radius: 50%; background: #38c6ff;
    border: 2px solid #fff; box-shadow: 0 0 10px #00d0ff;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: radial-gradient(circle at center, rgba(10, 35, 78, 0.72), rgba(4, 10, 22, 0.9));
    backdrop-filter: blur(7px);
    color: #fff; text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
  .title-badge {
    font-size: 12px; letter-spacing: 3px; color: #5ce1ff; font-weight: 800;
    background: rgba(0, 162, 255, 0.16); border: 1px solid rgba(92, 225, 255, 0.45);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(34px, 6vw, 64px); font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(180deg, #ffffff 0%, #8ce2ff 55%, #1982ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 8px 24px rgba(0, 140, 255, 0.55));
    margin-bottom: 10px;
  }
  .subtitle { color: #cde7ff; font-size: 15px; margin-bottom: 26px; max-width: 520px; line-height: 1.6; }
  .controls-grid {
    display: grid; grid-template-columns: repeat(2, minmax(170px, 1fr)); gap: 10px;
    margin-bottom: 28px; text-align: left;
  }
  .ctrl-item {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #dbeeff;
  }
  .ctrl-item b { color: #ffd84d; display: block; margin-bottom: 2px; }
  .btn-start {
    cursor: pointer; border: none; outline: none;
    padding: 15px 42px; border-radius: 999px; font-size: 18px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #0077ff, #00c8ff);
    box-shadow: 0 0 28px rgba(0, 185, 255, 0.65), inset 0 2px 3px rgba(255,255,255,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 38px rgba(0, 210, 255, 0.9); }
  .result-stats {
    display: flex; gap: 24px; margin: 16px 0 26px;
    background: rgba(255,255,255,0.08); padding: 14px 26px; border-radius: 14px;
  }

  #touch-controls {
    position: fixed; bottom: 18px; left: 18px; right: 18px;
    display: none; justify-content: space-between; align-items: flex-end;
    z-index: 15; pointer-events: none;
  }
  .touch-group { display: flex; gap: 10px; pointer-events: auto; }
  .t-btn {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(10, 30, 60, 0.62); color: #fff; font-size: 20px; font-weight: 800;
    border: 2px solid rgba(100, 210, 255, 0.55); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .t-btn.boost { background: rgba(0, 140, 255, 0.65); font-size: 13px; }
  @media (pointer: coarse), (max-width: 820px) {
    #touch-controls { display: flex; }
    #progress-wrap { display: none; }
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-panel">
    <div class="stat">
      <span class="stat-label">SCORE</span>
      <span class="stat-value" id="ui-score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">RINGS</span>
      <span class="stat-value rings" id="ui-rings">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">TIME</span>
      <span class="stat-value" id="ui-time">00:00</span>
    </div>
  </div>
  <div class="hud-panel">
    <div class="boost-wrap">
      <span class="stat-label">LIGHTNING BOOST (SHIFT)</span>
      <div class="boost-bar-bg"><div class="boost-bar-fill" id="ui-boost"></div></div>
    </div>
    <div class="stat">
      <span class="stat-label">SPEED</span>
      <span class="stat-value" id="ui-speed">0</span>
    </div>
  </div>
</div>

<div id="progress-wrap">
  <div class="prog-track">
    <div class="prog-fill" id="ui-prog-fill"></div>
    <div class="prog-dot" id="ui-prog-dot"></div>
  </div>
</div>

<div id="overlay">
  <div class="title-badge">CINEMATIC REALISM EDITION</div>
  <h1 id="ov-title">수퍼 소닉: 시네마틱 러시</h1>
  <p class="subtitle" id="ov-desc">그린 힐 해안 도로를 초음속으로 질주하며 링을 모으고 배드닉을 격파해 골 지점에 도달하세요.</p>
  <div class="controls-grid" id="ov-controls">
    <div class="ctrl-item"><b>이동</b>← / → 또는 A / D</div>
    <div class="ctrl-item"><b>점프 / 2단 호밍</b>Space 또는 ↑ / W</div>
    <div class="ctrl-item"><b>스핀 대시</b>↓ 누른 채 Space 연타 후 떼기</div>
    <div class="ctrl-item"><b>라이트닝 부스트</b>Shift (고속 돌진 & 적 격파)</div>
  </div>
  <div class="result-stats" id="ov-results" style="display:none;"></div>
  <button class="btn-start" id="btn-start">게임 시작</button>
</div>

<div id="touch-controls">
  <div class="touch-group">
    <button class="t-btn" data-key="left">◀</button>
    <button class="t-btn" data-key="down">▼</button>
    <button class="t-btn" data-key="right">▶</button>
  </div>
  <div class="touch-group">
    <button class="t-btn boost" data-key="boost">BOOST</button>
    <button class="t-btn" data-key="jump">▲</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // UI 요소
  const uiScore = document.getElementById('ui-score');
  const uiRings = document.getElementById('ui-rings');
  const uiTime = document.getElementById('ui-time');
  const uiBoost = document.getElementById('ui-boost');
  const uiSpeed = document.getElementById('ui-speed');
  const uiProgFill = document.getElementById('ui-prog-fill');
  const uiProgDot = document.getElementById('ui-prog-dot');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovDesc = document.getElementById('ov-desc');
  const ovControls = document.getElementById('ov-controls');
  const ovResults = document.getElementById('ov-results');
  const btnStart = document.getElementById('btn-start');

  let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ================= Web Audio API 사운드 엔진 =================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, endFreq, dur, type = 'sine', vol = 0.14) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);
  }
  const sfx = {
    ring: () => { playTone(1250, 1850, 0.08, 'sine', 0.11); setTimeout(() => playTone(1850, 2400, 0.12, 'triangle', 0.09), 50); },
    jump: () => playTone(260, 760, 0.16, 'triangle', 0.13),
    spinCharge: () => playTone(220, 520, 0.09, 'sawtooth', 0.08),
    spinRelease: () => playTone(180, 980, 0.24, 'sawtooth', 0.13),
    boost: () => playTone(320, 1400, 0.22, 'sawtooth', 0.12),
    spring: () => playTone(300, 1150, 0.26, 'sine', 0.15),
    enemy: () => { playTone(180, 55, 0.22, 'square', 0.15); playTone(520, 140, 0.16, 'sawtooth', 0.1); },
    hurt: () => { for (let i = 0; i < 4; i++) setTimeout(() => playTone(900 - i*150, 350, 0.12, 'triangle', 0.1), i*45); },
    clear: () => {
      [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => playTone(f, f * 1.02, 0.28, 'triangle', 0.15), i * 110));
    }
  };

  // ================= 지형 함수 (그린 힐 해안 곡선) =================
  const STAGE_LENGTH = 13500;
  function getGroundY(x) {
    const base = 520;
    if (x < 450) return base;
    const h1 = Math.sin(x * 0.0016) * 78;
    const h2 = Math.sin(x * 0.0043 + 1.2) * 34;
    const h3 = Math.cos(x * 0.00085) * 55;
    // 후반부 완만한 결승 구간
    const endBlend = x > STAGE_LENGTH - 700 ? Math.max(0, 1 - (x - (STAGE_LENGTH - 700)) / 500) : 1;
    return base + (h1 + h2 + h3) * endBlend;
  }
  function getGroundSlope(x) {
    return (getGroundY(x + 4) - getGroundY(x - 4)) / 8;
  }

  // ================= 게임 상태 =================
  const keys = { left: false, right: false, down: false, jump: false, boost: false };
  let jumpPressed = false;
  let state = 'menu'; // menu, playing, clear, gameover
  let elapsed = 0;
  let score = 0;
  let rings = 0;
  let combo = 0;
  let shake = 0;
  let camX = 0, camY = 0;
  let timeTick = 0;

  let player = {};
  let ringList = [];
  let scatteredRings = [];
  let enemies = [];
  let springs = [];
  let boostPads = [];
  let particles = [];
  let lightnings = [];
  let afterimages = [];
  let floatingTexts = [];
  let palmTrees = [];
  let clouds = [];

  // 프로시저럴 구름 초기화
  for (let i = 0; i < 16; i++) {
    clouds.push({
      x: i * 420 + Math.random() * 200,
      y: 55 + Math.random() * 140,
      s: 0.7 + Math.random() * 0.9,
      sp: 8 + Math.random() * 12
    });
  }

  function resetGame() {
    elapsed = 0; score = 0; rings = 0; combo = 0; shake = 0;
    player = {
      x: 160, y: getGroundY(160) - 26,
      vx: 0, vy: 0,
      radius: 24,
      facing: 1,
      grounded: true,
      spinning: false,
      crouching: false,
      spinCharge: 0,
      boostEnergy: 100,
      boosting: false,
      invuln: 0,
      animPhase: 0,
      airJumpReady: true
    };
    camX = 0; camY = player.y - H * 0.62;
    ringList = []; scatteredRings = []; enemies = []; springs = []; boostPads = [];
    particles = []; lightnings = []; afterimages = []; floatingTexts = []; palmTrees = [];

    // 야자수 배치
    for (let x = 220; x < STAGE_LENGTH + 400; x += 340 + Math.random() * 260) {
      palmTrees.push({ x, h: 120 + Math.random() * 75, lean: (Math.random() - 0.5) * 36 });
    }

    // 링 배치 (지형 따라 + 점프 아치)
    for (let x = 520; x < STAGE_LENGTH - 500; x += 520) {
      const pattern = Math.floor((x / 520) % 3);
      if (pattern === 0) {
        for (let i = 0; i < 6; i++) {
          const rx = x + i * 46;
          ringList.push({ x: rx, y: getGroundY(rx) - 34, collected: false });
        }
      } else if (pattern === 1) {
        for (let i = 0; i < 7; i++) {
          const rx = x + i * 44;
          const arc = Math.sin((i / 6) * Math.PI) * 115;
          ringList.push({ x: rx, y: getGroundY(rx) - 38 - arc, collected: false });
        }
      } else {
        for (let i = 0; i < 5; i++) {
          const rx = x + i * 50;
          ringList.push({ x: rx, y: getGroundY(rx) - 135, collected: false });
        }
      }
    }

    // 스프링 & 부스트 패드 배치
    for (let x = 1350; x < STAGE_LENGTH - 900; x += 1650) {
      springs.push({ x, y: getGroundY(x), bounceAnim: 0 });
      for (let i = 0; i < 5; i++) {
        ringList.push({ x: x + 90 + i * 55, y: getGroundY(x) - 210 - Math.sin(i * 0.7) * 45, collected: false });
      }
    }
    for (let x = 900; x < STAGE_LENGTH - 1000; x += 1450) {
      boostPads.push({ x, y: getGroundY(x) });
    }

    // 배드닉(적) 배치
    for (let x = 1100; x < STAGE_LENGTH - 750; x += 680) {
      const flying = ((x / 680) | 0) % 2 === 1;
      enemies.push({
        type: flying ? 'buzz' : 'moto',
        x, startX: x,
        y: flying ? getGroundY(x) - 130 : getGroundY(x) - 22,
        vx: flying ? 90 : 75,
        range: 190,
        alive: true,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // ================= 입력 처리 =================
  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!keys.jump) jumpPressed = true;
      keys.jump = true;
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
  });

  // 모바일 터치 버튼
  document.querySelectorAll('.t-btn').forEach(btn => {
    const k = btn.dataset.key;
    const onDown = e => {
      e.preventDefault();
      if (k === 'jump' && !keys.jump) jumpPressed = true;
      keys[k] = true;
    };
    const onUp = e => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('touchstart', onDown, { passive: false });
    btn.addEventListener('touchend', onUp, { passive: false });
    btn.addEventListener('mousedown', onDown);
    btn.addEventListener('mouseup', onUp);
    btn.addEventListener('mouseleave', onUp);
  });

  btnStart.addEventListener('click', () => {
    initAudio();
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
  });

  // ================= 파티클 & 이펙트 헬퍼 =================
  function spawnParticles(x, y, count, color, speed = 220, size = 4) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (0.3 + Math.random() * 0.85) * speed;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 40,
        life: 0.35 + Math.random() * 0.35, maxLife: 0.7,
        color, size: size * (0.6 + Math.random() * 0.8)
      });
    }
  }
  function spawnLightning(x, y) {
    const pts = [{ x, y }];
    let cx = x, cy = y;
    for (let i = 0; i < 4; i++) {
      cx += (Math.random() - 0.5) * 44;
      cy += (Math.random() - 0.5) * 44;
      pts.push({ x: cx, y: cy });
    }
    lightnings.push({ pts, life: 0.14 });
  }
  function addFloatingText(x, y, text, color = '#fff') {
    floatingTexts.push({ x, y, text, color, life: 0.9 });
  }

  // ================= 업데이트 로직 =================
  function update(dt) {
    timeTick += dt;
    clouds.forEach(c => { c.x -= c.sp * dt; if (c.x < -350) c.x = W + 350; });

    if (state !== 'playing') return;
    elapsed += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);

    const slope = getGroundSlope(player.x);
    const maxRun = player.boosting ? 1150 : 760;
    const accel = player.grounded ? 1350 : 880;

    // 부스트 처리
    if (keys.boost && player.boostEnergy > 4 && !player.crouching) {
      if (!player.boosting) sfx.boost();
      player.boosting = true;
      player.boostEnergy = Math.max(0, player.boostEnergy - dt * 36);
      const targetVx = player.facing * 1120;
      player.vx += (targetVx - player.vx) * Math.min(1, dt * 10);
      if (Math.random() < 0.65) spawnLightning(player.x, player.y);
      if (Math.random() < 0.7) spawnParticles(player.x - player.facing * 18, player.y, 1, '#3ce6ff', 140, 3.5);
    } else {
      player.boosting = false;
      player.boostEnergy = Math.min(100, player.boostEnergy + dt * 12);
    }

    // 스핀 대시 & 웅크리기
    if (player.grounded && keys.down && Math.abs(player.vx) < 120) {
      player.crouching = true;
      player.vx *= 0.85;
      if (jumpPressed) {
        player.spinCharge = Math.min(100, player.spinCharge + 28);
        sfx.spinCharge();
        spawnParticles(player.x - player.facing * 14, player.y + 18, 5, '#5ce1ff', 160, 3);
      }
    } else {
      if (player.crouching && player.spinCharge > 0) {
        player.vx = player.facing * (680 + player.spinCharge * 5.2);
        player.spinning = true;
        sfx.spinRelease();
        shake = 6;
        spawnParticles(player.x, player.y + 12, 16, '#00d9ff', 280, 4);
      }
      player.crouching = false;
      player.spinCharge = 0;
    }

    // 좌우 이동
    if (!player.crouching && !player.boosting) {
      if (keys.right) {
        player.facing = 1;
        player.vx = Math.min(maxRun, player.vx + accel * dt);
      } else if (keys.left) {
        player.facing = -1;
        player.vx = Math.max(-maxRun, player.vx - accel * dt);
      } else if (player.grounded) {
        player.vx *= Math.pow(0.06, dt);
        if (Math.abs(player.vx) < 8) player.vx = 0;
      }
    }

    // 지형 경사 가속
    if (player.grounded) {
      player.vx += slope * 420 * dt;
      if (Math.abs(player.vx) < 160) player.spinning = false;
    }

    // 점프 및 공중 호밍 대시
    if (jumpPressed && !player.crouching) {
      if (player.grounded) {
        player.vy = -650;
        player.grounded = false;
        player.spinning = true;
        player.airJumpReady = true;
        sfx.jump();
        spawnParticles(player.x, player.y + 20, 8, '#9ce8ff', 150, 3);
      } else if (player.airJumpReady) {
        // 공중 호밍/대시 어택
        player.airJumpReady = false;
        player.spinning = true;
        player.vx = player.facing * Math.max(Math.abs(player.vx), 680);
        player.vy = -260;
        sfx.boost();
        spawnLightning(player.x, player.y);
        spawnParticles(player.x, player.y, 10, '#00d9ff', 220, 3.5);
      }
    }
    jumpPressed = false;

    // 중력 및 위치 갱신
    if (!player.grounded) player.vy += 1750 * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    if (player.x < 40) { player.x = 40; player.vx = 0; }

    // 지면 충돌 판정
    const gY = getGroundY(player.x);
    if (player.y + player.radius >= gY) {
      if (!player.grounded && player.vy > 0) {
        player.grounded = true;
        player.spinning = false;
        combo = 0;
      }
      if (player.grounded) {
        player.y = gY - player.radius;
        player.vy = 0;
      }
    } else if (player.grounded && gY - (player.y + player.radius) > 18) {
      player.grounded = false;
    }

    // 애니메이션 위상 & 초고속 잔상/번개
    player.animPhase += Math.max(6, Math.abs(player.vx) * 0.032) * dt;
    if (Math.abs(player.vx) > 640 || player.boosting) {
      if (Math.random() < 0.45) {
        afterimages.push({ x: player.x, y: player.y, spinning: player.spinning, facing: player.facing, life: 0.22 });
      }
      if (Math.random() < 0.22) spawnLightning(player.x, player.y);
    }

    // 링 수집
    for (const r of ringList) {
      if (r.collected) continue;
      const dx = player.x - r.x, dy = player.y - r.y;
      if (dx * dx + dy * dy < 38 * 38) {
        r.collected = true;
        rings++;
        score += 100;
        player.boostEnergy = Math.min(100, player.boostEnergy + 5);
        sfx.ring();
        spawnParticles(r.x, r.y, 7, '#ffe055', 160, 3);
      }
    }

    // 흩어진 링 업데이트 및 재획득
    for (let i = scatteredRings.length - 1; i >= 0; i--) {
      const sr = scatteredRings[i];
      sr.life -= dt;
      sr.vy += 1200 * dt;
      sr.x += sr.vx * dt;
      sr.y += sr.vy * dt;
      const sg = getGroundY(sr.x);
      if (sr.y + 12 > sg) { sr.y = sg - 12; sr.vy = -Math.abs(sr.vy) * 0.68; sr.vx *= 0.88; }
      if (sr.life < 4.4) {
        const dx = player.x - sr.x, dy = player.y - sr.y;
        if (dx * dx + dy * dy < 36 * 36) {
          rings++; score += 50; sfx.ring();
          spawnParticles(sr.x, sr.y, 6, '#ffe055', 130, 3);
          scatteredRings.splice(i, 1);
          continue;
        }
      }
      if (sr.life <= 0) scatteredRings.splice(i, 1);
    }

    // 스프링 충돌
    for (const sp of springs) {
      if (sp.bounceAnim > 0) sp.bounceAnim = Math.max(0, sp.bounceAnim - dt * 4);
      const dx = player.x - sp.x, dy = (player.y + player.radius) - sp.y;
      if (Math.abs(dx) < 34 && Math.abs(dy) < 28 && player.vy >= -50) {
        player.vy = -960;
        player.grounded = false;
        player.spinning = true;
        player.airJumpReady = true;
        sp.bounceAnim = 1;
        sfx.spring();
        spawnParticles(sp.x, sp.y - 10, 12, '#ff5555', 220, 4);
      }
    }

    // 부스트 패드 충돌
    for (const bp of boostPads) {
      const dx = player.x - bp.x, dy = (player.y + player.radius) - bp.y;
      if (Math.abs(dx) < 42 && Math.abs(dy) < 26) {
        player.vx = Math.max(player.vx, 1280);
        player.facing = 1;
        player.boostEnergy = Math.min(100, player.boostEnergy + 22);
        sfx.boost();
        shake = 5;
        spawnLightning(player.x, player.y);
      }
    }

    // 배드닉 업데이트 & 충돌
    for (const en of enemies) {
      if (!en.alive) continue;
      en.phase += dt * 4;
      en.x += en.vx * dt;
      if (en.x > en.startX + en.range) { en.x = en.startX + en.range; en.vx = -Math.abs(en.vx); }
      if (en.x < en.startX - en.range) { en.x = en.startX - en.range; en.vx = Math.abs(en.vx); }
      en.y = en.type === 'buzz' ? getGroundY(en.x) - 130 + Math.sin(en.phase) * 16 : getGroundY(en.x) - 22;

      const dx = player.x - en.x, dy = player.y - en.y;
      if (dx * dx + dy * dy < 44 * 44) {
        const attacking = player.spinning || player.boosting || (!player.grounded && player.vy > 0);
        if (attacking) {
          en.alive = false;
          combo++;
          const pts = 200 * combo;
          score += pts;
          player.boostEnergy = Math.min(100, player.boostEnergy + 18);
          if (!player.grounded && !player.boosting) player.vy = -520;
          sfx.enemy();
          shake = 8;
          spawnParticles(en.x, en.y, 22, '#ff7722', 320, 5);
          spawnParticles(en.x, en.y, 12, '#fff088', 220, 3);
          addFloatingText(en.x, en.y - 24, `+${pts}${combo > 1 ? ' (' + combo + ' COMBO!)' : ''}`, '#5ce1ff');
        } else if (player.invuln <= 0) {
          if (rings > 0) {
            const drop = Math.min(rings, 18);
            for (let i = 0; i < drop; i++) {
              const ang = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
              const spd = 220 + Math.random() * 340;
              scatteredRings.push({
                x: player.x, y: player.y - 10,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                life: 5.0
              });
            }
            rings = 0;
            player.invuln = 2.0;
            player.vy = -420;
            player.vx = -player.facing * 260;
            player.grounded = false;
            sfx.hurt();
            shake = 12;
          } else {
            endGame(false);
          }
        }
      }
    }

    // 파티클 / 번개 / 잔상 / 텍스트 갱신
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = lightnings.length - 1; i >= 0; i--) {
      lightnings[i].life -= dt;
      if (lightnings[i].life <= 0) lightnings.splice(i, 1);
    }
    for (let i = afterimages.length - 1; i >= 0; i--) {
      afterimages[i].life -= dt;
      if (afterimages[i].life <= 0) afterimages.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].life -= dt; floatingTexts[i].y -= 55 * dt;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }

    // 골 지점 도달 판정
    if (player.x >= STAGE_LENGTH) {
      endGame(true);
    }

    // 부드러운 카메라 추적 (속도에 따라 전방 시야 확보)
    const lookAhead = player.facing * Math.min(220, Math.abs(player.vx) * 0.24);
    const targetCamX = Math.max(0, player.x - W * 0.34 + lookAhead);
    const targetCamY = player.y - H * 0.62;
    camX += (targetCamX - camX) * Math.min(1, dt * 8);
    camY += (targetCamY - camY) * Math.min(1, dt * 6);

    // HUD 갱신
    uiScore.textContent = score.toLocaleString();
    uiRings.textContent = rings;
    uiRings.classList.toggle('danger', rings === 0);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const secs = String(Math.floor(elapsed % 60)).padStart(2, '0');
    uiTime.textContent = `${mins}:${secs}`;
    uiBoost.style.width = `${player.boostEnergy}%`;
    uiSpeed.textContent = `${Math.round(Math.abs(player.vx) * 0.28)} km/h`;
    const prog = Math.min(100, (player.x / STAGE_LENGTH) * 100);
    uiProgFill.style.width = `${prog}%`;
    uiProgDot.style.left = `${prog}%`;
  }

  function endGame(cleared) {
    state = cleared ? 'clear' : 'gameover';
    if (cleared) {
      sfx.clear();
      const timeBonus = Math.max(0, Math.round((120 - elapsed) * 50));
      const ringBonus = rings * 100;
      score += timeBonus + ringBonus;
      ovTitle.textContent = 'STAGE CLEAR!';
      ovDesc.textContent = '시네마틱 그린 힐 해안 스테이지를 초음속으로 돌파했습니다!';
    } else {
      sfx.hurt();
      ovTitle.textContent = 'GAME OVER';
      ovDesc.textContent = '링이 없는 상태에서 배드닉과 충돌했습니다. 다시 도전해 보세요!';
    }
    ovControls.style.display = 'none';
    ovResults.style.display = 'flex';
    ovResults.innerHTML = `
      <div class="stat"><span class="stat-label">FINAL SCORE</span><span class="stat-value">${score.toLocaleString()}</span></div>
      <div class="stat"><span class="stat-label">RINGS</span><span class="stat-value rings">${rings}</span></div>
      <div class="stat"><span class="stat-label">TIME</span><span class="stat-value">${uiTime.textContent}</span></div>
    `;
    btnStart.textContent = '다시 플레이';
    overlay.classList.remove('hidden');
  }

  // ================= 실사 시네마틱 렌더링 =================
  function drawBackground() {
    // 1. 시네마틱 하늘 그라데이션
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a3a82');
    sky.addColorStop(0.42, '#2d82d6');
    sky.addColorStop(0.75, '#8fd3f4');
    sky.addColorStop(1, '#ffe6be');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 2. 태양 및 렌즈 플레어
    const sunX = W * 0.78 - camX * 0.015;
    const sunY = H * 0.2;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 210);
    sunGlow.addColorStop(0, 'rgba(255,255,240,1)');
    sunGlow.addColorStop(0.16, 'rgba(255,235,170,0.85)');
    sunGlow.addColorStop(0.45, 'rgba(255,190,110,0.22)');
    sunGlow.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath(); ctx.arc(sunX, sunY, 210, 0, Math.PI * 2); ctx.fill();

    // 3. 입체 구름
    clouds.forEach(c => {
      const cx = ((c.x - camX * 0.06) % (W + 500) + (W + 500)) % (W + 500) - 250;
      const g = ctx.createLinearGradient(cx, c.y - 30 * c.s, cx, c.y + 24 * c.s);
      g.addColorStop(0, 'rgba(255,255,255,0.92)');
      g.addColorStop(1, 'rgba(185,215,245,0.55)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, c.y, 34 * c.s, 0, Math.PI * 2);
      ctx.arc(cx + 32 * c.s, c.y - 10 * c.s, 42 * c.s, 0, Math.PI * 2);
      ctx.arc(cx + 72 * c.s, c.y + 2 * c.s, 30 * c.s, 0, Math.PI * 2);
      ctx.fill();
    });

    // 4. 대기 원근 원경 산맥 (패럴랙스 0.12)
    const horizon = H * 0.64;
    ctx.fillStyle = '#3f76a8';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let sx = 0; sx <= W + 40; sx += 40) {
      const wx = sx + camX * 0.12;
      const mh = Math.sin(wx * 0.0022) * 85 + Math.cos(wx * 0.0055) * 35;
      ctx.lineTo(sx, horizon - 95 - mh);
    }
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();

    // 5. 중경 녹지 섬과 폭포 (패럴랙스 0.25)
    ctx.fillStyle = '#245e63';
    ctx.beginPath();
    ctx.moveTo(0, horizon + 10);
    for (let sx = 0; sx <= W + 30; sx += 30) {
      const wx = sx + camX * 0.25;
      const mh = Math.sin(wx * 0.0038 + 2) * 52 + Math.cos(wx * 0.009) * 20;
      ctx.lineTo(sx, horizon - 38 - mh);
    }
    ctx.lineTo(W, horizon + 10); ctx.closePath(); ctx.fill();

    // 6. 반짝이는 바다 수면
    const sea = ctx.createLinearGradient(0, horizon, 0, H);
    sea.addColorStop(0, '#0f6db3');
    sea.addColorStop(0.5, '#07447d');
    sea.addColorStop(1, '#042347');
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizon, W, H - horizon);

    // 바다 스페큘러 반짝임
    ctx.fillStyle = 'rgba(255, 245, 210, 0.35)';
    for (let i = 0; i < 28; i++) {
      const y = horizon + 10 + i * 7;
      const w = 40 + Math.sin(timeTick * 3 + i) * 25;
      const x = sunX - w / 2 + Math.sin(timeTick * 2 + i * 1.4) * 28;
      ctx.fillRect(x, y, w, 2);
    }
  }

  function drawTerrain() {
    const startX = Math.floor(camX / 24) * 24 - 48;
    const endX = camX + W + 72;

    // 야자수 (지형 뒤쪽)
    for (const pt of palmTrees) {
      if (pt.x < startX - 100 || pt.x > endX + 100) continue;
      const gy = getGroundY(pt.x);
      const topX = pt.x + pt.lean, topY = gy - pt.h;
      ctx.strokeStyle = '#6d472a';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pt.x, gy + 8);
      ctx.quadraticCurveTo(pt.x + pt.lean * 0.3, gy - pt.h * 0.5, topX, topY);
      ctx.stroke();

      // 야자수 잎
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 + Math.sin(timeTick * 1.8 + pt.x) * 0.08;
        ctx.strokeStyle = i % 2 === 0 ? '#1b7a38' : '#2ea348';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(
          topX + Math.cos(ang) * 35, topY + Math.sin(ang) * 16 - 14,
          topX + Math.cos(ang) * 62, topY + Math.sin(ang) * 30 + 14
        );
        ctx.stroke();
      }
    }

    // 암석/토양 본체
    const soilGrad = ctx.createLinearGradient(0, camY + H * 0.4, 0, camY + H + 120);
    soilGrad.addColorStop(0, '#6e4223');
    soilGrad.addColorStop(0.4, '#472814');
    soilGrad.addColorStop(1, '#1e1008');
    ctx.fillStyle = soilGrad;
    ctx.beginPath();
    ctx.moveTo(startX, camY + H + 200);
    for (let x = startX; x <= endX; x += 24) ctx.lineTo(x, getGroundY(x));
    ctx.lineTo(endX, camY + H + 200);
    ctx.closePath();
    ctx.fill();

    // 그린 힐 스타일 입체 바둑판 암석 음영
    ctx.save();
    ctx.clip();
    const tile = 48;
    const tx0 = Math.floor(startX / tile) * tile;
    for (let x = tx0; x < endX; x += tile) {
      const gy = getGroundY(x);
      for (let row = 0; row < 7; row++) {
        const y = gy + 18 + row * tile;
        const dark = ((Math.floor(x / tile) + row) % 2 === 0);
        ctx.fillStyle = dark ? 'rgba(0,0,0,0.16)' : 'rgba(255,190,120,0.08)';
        ctx.fillRect(x, y, tile, tile);
      }
    }
    ctx.restore();

    // 상단 두꺼운 잔디층
    const grassGrad = ctx.createLinearGradient(0, camY + H * 0.3, 0, camY + H * 0.8);
    grassGrad.addColorStop(0, '#4be34b');
    grassGrad.addColorStop(1, '#14822a');
    ctx.strokeStyle = grassGrad;
    ctx.lineWidth = 22;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = startX; x <= endX; x += 20) {
      const y = getGroundY(x) + 6;
      if (x === startX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 잔디 하이라이트 & 흔들리는 풀잎
    ctx.strokeStyle = '#9dff70';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = startX; x <= endX; x += 20) {
      const y = getGroundY(x) - 3;
      if (x === startX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function drawRing(x, y, alpha = 1) {
    const spin = Math.abs(Math.cos(timeTick * 5 + x * 0.02));
    const rx = Math.max(3, 13 * spin);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.shadowColor = 'rgba(255, 200, 0, 0.85)';
    ctx.shadowBlur = 12;
    const g = ctx.createLinearGradient(-rx, -13, rx, 13);
    g.addColorStop(0, '#fff7b2');
    g.addColorStop(0.5, '#ffbe0b');
    g.addColorStop(1, '#b87600');
    ctx.strokeStyle = g;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, 13, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawObjects() {
    // 스프링
    for (const sp of springs) {
      if (sp.x < camX - 80 || sp.x > camX + W + 80) continue;
      const lift = sp.bounceAnim * 16;
      ctx.fillStyle = '#8d99ae';
      ctx.fillRect(sp.x - 12, sp.y - 14 - lift, 24, 14 + lift);
      const topG = ctx.createLinearGradient(sp.x - 24, sp.y - 24 - lift, sp.x + 24, sp.y - 12 - lift);
      topG.addColorStop(0, '#ff6b6b'); topG.addColorStop(1, '#b8001f');
      ctx.fillStyle = topG;
      ctx.beginPath();
      ctx.roundRect(sp.x - 24, sp.y - 24 - lift, 48, 12, 6);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(sp.x - 10, sp.y - 22 - lift, 20, 4);
    }

    // 부스트 패드
    for (const bp of boostPads) {
      if (bp.x < camX - 80 || bp.x > camX + W + 80) continue;
      ctx.save();
      ctx.translate(bp.x, bp.y);
      ctx.rotate(Math.atan(getGroundSlope(bp.x)));
      ctx.fillStyle = '#1b263b';
      ctx.fillRect(-34, -8, 68, 10);
      const glow = (Math.sin(timeTick * 14) + 1) * 0.5;
      ctx.fillStyle = `rgba(0, 229, 255, ${0.65 + glow * 0.35})`;
      for (let i = -20; i <= 14; i += 16) {
        ctx.beginPath();
        ctx.moveTo(i, -7); ctx.lineTo(i + 12, -3); ctx.lineTo(i, 1); ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // 골 표지판
    const goalY = getGroundY(STAGE_LENGTH);
    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(STAGE_LENGTH - 5, goalY - 120, 10, 120);
    const signG = ctx.createLinearGradient(STAGE_LENGTH - 36, goalY - 165, STAGE_LENGTH + 36, goalY - 105);
    signG.addColorStop(0, '#00c6ff'); signG.addColorStop(1, '#0047ab');
    ctx.fillStyle = signG;
    ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(STAGE_LENGTH - 38, goalY - 165, 76, 56, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GOAL', STAGE_LENGTH, goalY - 131);

    // 링
    for (const r of ringList) {
      if (!r.collected && r.x > camX - 40 && r.x < camX + W + 40) drawRing(r.x, r.y);
    }
    for (const sr of scatteredRings) {
      const blink = sr.life < 1.5 ? (Math.sin(timeTick * 30) > 0 ? 1 : 0.25) : 1;
      drawRing(sr.x, sr.y, blink);
    }

    // 배드닉
    for (const en of enemies) {
      if (!en.alive || en.x < camX - 80 || en.x > camX + W + 80) continue;
      ctx.save();
      ctx.translate(en.x, en.y);
      if (en.vx < 0) ctx.scale(-1, 1);
      if (en.type === 'moto') {
        // 모토버그 (메탈릭 레드 쉘)
        const g = ctx.createRadialGradient(-6, -10, 4, 0, 0, 26);
        g.addColorStop(0, '#ff6b6b'); g.addColorStop(0.6, '#c1121f'); g.addColorStop(1, '#590d22');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 2, 22, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#1d2d44';
        ctx.beginPath(); ctx.arc(0, 12, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.arc(16, -5, 4, 0, Math.PI * 2); ctx.fill();
      } else {
        // 버즈봄버 (공중 드론형)
        ctx.fillStyle = 'rgba(200,240,255,0.65)';
        ctx.beginPath(); ctx.ellipse(-6, -18, 16, 6, Math.sin(timeTick * 40) * 0.5, 0, Math.PI * 2); ctx.fill();
        const g = ctx.createLinearGradient(-20, -10, 20, 10);
        g.addColorStop(0, '#ffd166'); g.addColorStop(0.5, '#0077b6'); g.addColorStop(1, '#03045e');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, 0, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff2a55';
        ctx.beginPath(); ctx.arc(16, -2, 4.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawSonic(x, y, facing, spinning, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(facing, 1);

    if (spinning) {
      // 회전하는 블루 에너지 구체
      const spinG = ctx.createRadialGradient(0, 0, 4, 0, 0, 28);
      spinG.addColorStop(0, '#e0faff');
      spinG.addColorStop(0.38, '#00b4ff');
      spinG.addColorStop(0.78, '#0044cc');
      spinG.addColorStop(1, 'rgba(0, 100, 255, 0)');
      ctx.shadowColor = '#00d9ff'; ctx.shadowBlur = 22;
      ctx.fillStyle = spinG;
      ctx.beginPath(); ctx.arc(0, 0, 27, 0, Math.PI * 2); ctx.fill();

      ctx.rotate(timeTick * 26);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 1.3); ctx.stroke();
      ctx.restore();
      return;
    }

    const speedRatio = Math.min(1, Math.abs(player.vx) / 760);
    const lean = speedRatio * 0.28;
    ctx.rotate(lean);

    // 초고속 8자 다리 모션 블러
    if (speedRatio > 0.65 && player.grounded) {
      ctx.strokeStyle = 'rgba(235, 30, 50, 0.72)';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.ellipse(0, 18, 18, 9, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // 입체 빨간 운동화
      const stride = Math.sin(player.animPhase) * (player.grounded ? 12 : 4);
      [-stride, stride].forEach((sx, idx) => {
        ctx.fillStyle = idx === 0 ? '#a8001c' : '#e61938';
        ctx.beginPath(); ctx.ellipse(sx, 20, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx - 5, 16, 10, 3);
        ctx.fillStyle = '#ffd84d';
        ctx.fillRect(sx + 3, 18, 4, 3);
      });
    }

    // 파란 가시 (시네마틱 입체 음영)
    const furGrad = ctx.createRadialGradient(-4, -12, 3, 0, -4, 28);
    furGrad.addColorStop(0, '#4dc3ff');
    furGrad.addColorStop(0.55, '#0b5ed7');
    furGrad.addColorStop(1, '#042a6b');
    ctx.fillStyle = furGrad;

    // 뒤쪽 3단 가시
    ctx.beginPath();
    ctx.moveTo(-4, -22); ctx.lineTo(-28, -18); ctx.lineTo(-12, -8);
    ctx.lineTo(-30, -2); ctx.lineTo(-12, 4);
    ctx.lineTo(-22, 12); ctx.lineTo(-4, 10);
    ctx.closePath(); ctx.fill();

    // 몸통 & 배
    ctx.beginPath(); ctx.ellipse(0, 5, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f2caa0';
    ctx.beginPath(); ctx.ellipse(3, 6, 6, 8, 0, 0, Math.PI * 2); ctx.fill();

    // 머리
    ctx.fillStyle = furGrad;
    ctx.beginPath(); ctx.arc(2, -10, 14, 0, Math.PI * 2); ctx.fill();

    // 주둥이 & 초록 눈 (실사 영화 스타일)
    ctx.fillStyle = '#f5cfa6';
    ctx.beginPath(); ctx.ellipse(10, -5, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(8, -12, 5.5, 7, -0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00c853';
    ctx.beginPath(); ctx.ellipse(10, -12, 2.4, 4.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(10.5, -12, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -7, 2.3, 0, Math.PI * 2); ctx.fill(); // 코

    // 흰 장갑
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-6, 8, 5, 0, Math.PI * 2); ctx.fill();

    // 부스트 전기 오라
    if (player.boosting) {
      ctx.strokeStyle = 'rgba(120, 235, 255, 0.85)';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, 30, -0.8, 0.8); ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    drawBackground();

    ctx.save();
    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(-camX + sx, -camY + sy);

    drawTerrain();
    drawObjects();

    // 잔상
    for (const ai of afterimages) {
      drawSonic(ai.x, ai.y, ai.facing, ai.spinning, ai.life * 1.8);
    }

    // 소닉 본체 (무적 점멸 처리)
    if (player.invuln <= 0 || Math.floor(timeTick * 18) % 2 === 0) {
      drawSonic(player.x, player.y, player.facing, player.spinning, 1);
    }

    // 라이트닝 아크
    ctx.save();
    ctx.strokeStyle = '#9cf5ff';
    ctx.shadowColor = '#00d9ff'; ctx.shadowBlur = 14;
    ctx.lineWidth = 2.4;
    for (const l of lightnings) {
      ctx.globalAlpha = l.life / 0.14;
      ctx.beginPath();
      l.pts.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
      ctx.stroke();
    }
    ctx.restore();

    // 파티클
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 콤보 점수 텍스트
    ctx.font = '900 18px sans-serif';
    ctx.textAlign = 'center';
    for (const ft of floatingTexts) {
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 시네마틱 비네팅
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, Math.max(W, H)*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,10,25,0.38)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // 메인 루프
  resetGame();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
